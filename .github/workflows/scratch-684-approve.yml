name: LUL-684 scratch approve

# Throwaway. Not part of the studio's real workflow set -- exists only to submit
# a GitHub-native APPROVED review on the scratch PR fixture for LUL-684's
# merge-gap-detector in-situ proof, under a different actor (github-actions[bot])
# than the PR author (the DadonStyle PAT used to open it), which is required or
# GitHub 422s on self-approval. Delete this file and the branch once the proof
# is captured.

on:
  push:
    branches: ['scratch/lul684-proof-head']

permissions:
  contents: read
  pull-requests: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: approve the open PR for this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NUM=$(gh pr list --repo DadonStyle/LULLWOOD --head scratch/lul684-proof-head --state open --json number --jq '.[0].number')
          if [ -z "$NUM" ]; then
            echo "no open PR found for this branch" >&2
            exit 1
          fi
          gh pr review "$NUM" --repo DadonStyle/LULLWOOD --approve --body "LUL-684 scratch fixture approval (throwaway)"
