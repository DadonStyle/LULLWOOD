name: Version cut finalize

# The second half of LUL-497. Fires once the cut PR opened by version-cut.yml
# actually merges (a merge commit into `main`, per LUL-492 §3.4 -- never
# squash, so individual PR history survives). Three things happen:
#
#   1. assert the merge that just landed actually has two parents (LUL-1041
#      -- see that step's own comment for why this has to come first).
#   2. tag the merge commit `vYYYY.MM.DD-N`, parsed from the PR title
#      version-cut.yml set, so tag and PR title stay in lockstep by
#      construction.
#   3. get everything `main` just gained back onto `release/next`, and arm
#      that PR to merge itself with `--merge` (LUL-1041) once green.
#
# Two further jobs, independent of `finalize` so neither can block tagging or the
# sync-back (LUL-6107): `pages-changed` diffs the cut for a page change, and
# `indexnow` (only if it did) waits for the Production deployment then runs
# scripts/indexnow.mjs. See that job's comment.
#
# "Recreate release/next from main" (LUL-492 §3.5) is NOT implemented as a
# reset or force-push. release/next carries the same `pull_request` and
# `non_fast_forward` rules as main (systems/release-train) -- direct pushes
# are rejected regardless of force, same as main -- and the studio-wide
# force-push ban (LUL-105, decisions/0010-no-force-push) applies to every
# branch with no carve-out for one this workflow manages. It's also the
# wrong behaviour even where it'd be technically possible: release/next keeps
# taking feature PRs the entire time the cut PR is out for review (strict is
# off there precisely so it can), so by the time this fires release/next may
# already be ahead of what went into the cut. A reset would silently drop
# that work. Instead this opens an ordinary PR (head=main, base=release/next)
# through the same gate every other release/next change goes through.
#
# LUL-1041: squashing either direction of this train discards the second
# parent, so `main` and `release/next` stop sharing an ancestor and every
# later cut opens with spurious conflicts (measured twice: PR #222, #223,
# and separately on the cut PR itself, PR #211 -- wiki systems/release-train).
# Both directions are now enforced here to always use `--merge`: the
# sync-back PR self-merges with `--merge` below, and the cut-PR-side landing
# is checked (not enforced -- that merge is still a human/reviewer call,
# Tier C) by the two-parent assertion as the very first step.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    name: tag and sync release/next
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'release/next' &&
      github.repository == 'DadonStyle/LULLWOOD'
    runs-on: ubuntu-latest
    steps:
      # LUL-1041: a squash discards the second parent, which is exactly what
      # broke this train twice (PR #222, #223 -- wiki systems/release-train).
      # Check this BEFORE tagging: tagging a squashed commit as a version
      # would make the bad merge look like a normal, successful cut. A
      # one-parent result here means someone merged the cut PR with
      # `--squash` instead of `--merge` -- fail loud, do not tag, do not
      # open the sync-back PR (it would only hit the same conflict LUL-1041
      # is about).
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: assert the cut landed as a real merge commit, not a squash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if ! node scripts/assert-two-parent-merge.mjs "$REPO" "$SHA"; then
            printf '%s\n' \
              '<!-- CUT_MERGE_NOT_A_MERGE_COMMIT -->' \
              "This cut landed on \`main\` as \`$SHA\`, but that commit does not have two" \
              'parents -- it was squashed (or fast-forwarded) instead of merged with' \
              '`--merge`. That silently breaks the shared ancestor between `main` and' \
              '`release/next`: the next cut PR will open with spurious conflicts on' \
              'anything both branches touched. LUL-1041.' \
              '' \
              'This run is NOT tagging a version and NOT opening the release/next' \
              'sync-back PR for that reason -- both would just compound the problem.' \
              '' \
              'Fix: re-do this cut with a real merge commit (`gh pr merge <n> --merge`),' \
              'never `--squash`, on the `release/next` -> `main` direction.' > /tmp/cut-not-merge.md
            gh pr comment "$PR" --repo "$REPO" --body-file /tmp/cut-not-merge.md
            exit 1
          fi

      - name: tag the version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TITLE: ${{ github.event.pull_request.title }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          # Title is "Release vYYYY.MM.DD-N" (version-cut.yml's own format).
          # Fall back to today's date + the merge commit's short sha if a
          # human retitled the PR -- never skip tagging over a cosmetic
          # mismatch, and never guess an N that could collide.
          tag="$(printf '%s' "$TITLE" | sed -n 's/^Release \(v[0-9.]*-[0-9]*\)$/\1/p')"
          if [ -z "$tag" ]; then
            tag="v$(date -u +%Y.%m.%d)-$(printf '%s' "$SHA" | cut -c1-7)"
            echo "::warning::cut PR title '$TITLE' didn't match the expected 'Release vYYYY.MM.DD-N' shape; tagging '$tag' instead."
          fi

          gh api "repos/$REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$SHA"
          echo "::notice::tagged $SHA as $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: open the release/next sync-back PR
        id: sync_pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          number="$(gh pr list --repo "$REPO" --state open --base release/next --head main --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            echo "::notice::sync-back PR #$number already open; not opening a duplicate."
            echo "number=$number" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' \
            "Mechanical sync after the $TAG version cut (LUL-497): brings" \
            'whatever `main` just gained back onto `release/next`, so it never' \
            'drifts (LUL-492 §3.5).' \
            '' \
            'Everything in this diff already went through the version-cut review --' \
            'nothing new to re-litigate, but branch protection on `release/next`' \
            'still requires a green run and one approval same as any other PR' \
            '(systems/release-train). Merge with a normal merge commit.' \
            '' \
            'Opened automatically by `.github/workflows/version-cut-finalize.yml`,' \
            'which also arms it to auto-merge itself with `--merge` (never `--squash`)' \
            'once its required check is green -- see the next step below and LUL-1041.' \
            > /tmp/sync-pr-body.md

          gh pr create --repo "$REPO" \
            --base release/next --head main \
            --title "Sync release/next after $TAG" \
            --body-file /tmp/sync-pr-body.md

          number="$(gh pr list --repo "$REPO" --state open --base release/next --head main --json number --jq '.[0].number')"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # LUL-1041: this PR is exactly the other direction of the same bug --
      # PR #222/#223 were hand-rolled attempts at this same sync that got
      # routed through the generic `lul-*` ship-squash pipeline
      # (automerge.yml) and squashed, discarding main's parent. Arming
      # auto-merge here, forced to `--merge`, means this specific PR (always
      # base=release/next, head=main, opened by this workflow) never again
      # needs a human -- or a workaround branch -- to land it correctly.
      #
      # github-actions[bot] authored this PR (gh pr create above ran under
      # GH_TOKEN), so it cannot approve its own PR (422) -- same constraint
      # automerge.yml documents. SHIP_REVIEW_PAT is the distinct identity
      # that can. Content here is mechanical (everything already passed
      # version-cut review), so approving it programmatically is the same
      # judgement call daily-report.yml already makes for its own
      # docs-only auto-merge.
      - name: approve and arm auto-merge on the sync-back PR (forced --merge)
        env:
          GH_TOKEN: ${{ github.token }}
          SHIP_REVIEW_TOKEN: ${{ secrets.SHIP_REVIEW_PAT }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.sync_pr.outputs.number }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          if [ -z "${SHIP_REVIEW_TOKEN:-}" ]; then
            echo "::warning::SHIP_REVIEW_PAT secret is not configured; sync-back PR #$NUMBER stays open for a human to review and merge with --merge (never --squash). LUL-558/LUL-1041."
            exit 0
          fi

          existing="$(gh api "repos/$REPO/pulls/$NUMBER/reviews" --jq '[.[] | select(.state == "APPROVED")] | length')"
          if [ "$existing" -eq 0 ]; then
            GH_TOKEN="$SHIP_REVIEW_TOKEN" gh pr review "$NUMBER" --approve \
              --body "Auto-approved: mechanical sync-back after the $TAG version cut, nothing new to re-litigate (LUL-1041)." \
              --repo "$REPO"
          fi

          # `--auto` arms native auto-merge and lets branch protection's own
          # required-check wait happen server-side; `--merge` is the whole
          # point of this step -- squash is never an option here, unlike the
          # generic `[ship]` path this deliberately does not reuse.
          #
          # LUL-762: arm under SHIP_REVIEW_TOKEN (guaranteed non-empty here,
          # the early exit above already covers the unconfigured case) so the
          # resulting release/next commit is PAT-authored and fires ci.yml's
          # push trigger -- the same fix as automerge.yml/auto-pr.yml/
          # daily-report.yml, same root cause (stranded cut PR #239).
          if ! GH_TOKEN="$SHIP_REVIEW_TOKEN" gh pr merge "$NUMBER" --repo "$REPO" --merge --auto; then
            echo "::warning::could not arm auto-merge (--merge) on sync-back PR #$NUMBER; it stays open. Merge it by hand with --merge, never --squash. LUL-1041."
          fi

  # LUL-6107. scripts/indexnow.mjs reads the LIVE sitemap.xml, so it must run only
  # after Vercel's Production deployment of this exact merge commit is live (merge
  # to main is not deploy-live), and only when the cut changed a page: cuts are
  # near-daily and IndexNow treats resubmitting an unchanged sitemap as abuse.
  # Google has no IndexNow; that path is Search Console.
  pages-changed:
    name: did the cut change a page
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'release/next' &&
      github.repository == 'DadonStyle/LULLWOOD'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pages: ${{ steps.diff.outputs.pages }}
    steps:
      # A closed-PR event checks out the PR merge ref by default; pin the real
      # merge commit so `^1` is main's previous tip.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2

      - name: diff the cut against main's previous tip
        id: diff
        env:
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          hits="$(git diff --name-only "$SHA^1" "$SHA" | grep -E '^(app/(.*/)?page\.tsx|app/sitemap\.ts|lib/devlog\.ts|lib/faq\.ts|public/llms\.txt)$' || true)"
          if [ -n "$hits" ]; then
            echo "pages=true" >> "$GITHUB_OUTPUT"
            echo "::notice::cut changed page files, IndexNow will run:"
            printf '%s\n' "$hits"
          else
            echo "pages=false" >> "$GITHUB_OUTPUT"
            echo "::notice::cut changed no page files; IndexNow skipped."
          fi

  indexnow:
    name: submit sitemap to IndexNow
    needs: pages-changed
    if: needs.pages-changed.outputs.pages == 'true'
    runs-on: ubuntu-latest
    # Never fail or block the release over a search-engine ping.
    continue-on-error: true
    timeout-minutes: 40
    concurrency:
      group: indexnow-production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: wait for the Production deployment of this merge commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            id="$(gh api "repos/$REPO/deployments?sha=$SHA&environment=Production" --jq '.[0].id // empty')"
            if [ -n "$id" ]; then
              state="$(gh api "repos/$REPO/deployments/$id/statuses" --jq '.[0].state // "none"')"
              echo "attempt $i: deployment $id state=$state"
              case "$state" in
                success) exit 0 ;;
                failure|error|inactive)
                  echo "::error::Production deployment $id ended $state; not submitting a stale sitemap."
                  exit 1 ;;
              esac
            else
              echo "attempt $i: no Production deployment for $SHA yet"
            fi
            sleep 30
          done
          echo "::error::no successful Production deployment for $SHA within 30 minutes; not submitting a stale sitemap."
          exit 1

      - name: submit to IndexNow
        run: node scripts/indexnow.mjs
