name: PR freshness

# Why this exists (LUL-380)
# -------------------------
# `main`'s ruleset requires branches to be strictly up to date before they can
# merge (systems/main-branch-merge-gate). Every PR merge re-stales every other
# open PR, so approved+green PRs were piling up BEHIND with nothing bringing
# them back up to date except an agent noticing by hand (LUL-361).
#
# This workflow does that backmerge automatically, using GitHub's "update
# pull request branch" API. That API performs a real merge commit from base
# into head -- it is not a rebase and it does not force-push -- so it matches
# decision 0010 (no force-push, branches track main by backmerge) without any
# agent having to run the manual loop in AGENTS.md for routine staleness.
#
# It does NOT touch review status or the merge itself. A PR still needs its
# own approval and green checks to land; this only keeps it mergeable.
#
# Conflicts are the one case this can't handle -- update-branch fails if the
# merge isn't clean, and this workflow does not attempt conflict resolution
# (that would risk exactly the "logic and function loss" LUL-380 warned
# about). It leaves a comment on the PR instead and moves on.
#
# LUL-439: update-branch's merge commit is authored via this workflow's own
# GITHUB_TOKEN, and GitHub does not emit push or pull_request events for
# commits made with GITHUB_TOKEN (recursion guard) -- so the new head would
# otherwise never get a CI run, ci.yml's push trigger and pull_request trigger
# both silently no-op on it, and the branch sits BLOCKED forever with every
# required context reading MISSING (not failing -- missing; measured in
# wiki systems/ci-github-token-blind-spot). workflow_dispatch is explicitly
# exempted from that suppression (GitHub docs: "workflow_dispatch and
# repository_dispatch events always create workflow runs"), and ci.yml
# already declares `workflow_dispatch:` as a trigger, so dispatching it on
# the branch right after a successful update-branch gets the exact same
# jobs (same job `if:` conditions all pass for workflow_dispatch, since
# github.event_name != 'pull_request') to run against the new head, with no
# new PAT/secret required.
#
# LUL-463: `github-actions[bot]` is permanently classified a first-time
# contributor (Settings -> Actions -> fork-pr-contributor-approval ==
# "first_time_contributors"), and every PR in this repo is opened by that
# bot (auto-pr.yml). So the `pull_request`-triggered CI run for every PR
# lands `action_required` -- parked, waiting for a human to click "Approve
# and run" -- and a parked run is not a skipped run and not an absent run:
# the ruleset still counts it as owing the required contexts, so the PR
# sits `blocked` forever even when every context already has a `success`
# instance from the push/workflow_dispatch run (measured live in wiki
# systems/main-branch-merge-gate, 2026-08-19 LUL-450 section).
#
# The safe fix is not loosening `approval_policy` -- that setting is the
# only thing stopping an actual fork PR from running arbitrary code on our
# runners, and this repo is public. Instead: auto-approve the parked run,
# but only when its head branch lives in THIS repository (i.e. it was
# pushed by us, not opened from a fork). `head_repository.full_name` on
# the run object is exactly the signal ci.yml's own job `if:` guards
# already use to draw this same line (see the LUL-100 comment in ci.yml).
# A fork's head repository can never equal `github.repository`, so a fork
# PR's parked run is never touched here and stays exactly as gated as
# GitHub's own policy already makes it.

on:
  push:
    branches: [main]
  schedule:
    # Fallback cadence in case the push trigger is missed (e.g. a merge that
    # landed while this workflow itself was mid-update). Same 30-minute
    # ballpark as the checks this feeds.
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: pr-freshness
  cancel-in-progress: false

jobs:
  refresh:
    name: backmerge main into stale open PRs
    runs-on: ubuntu-latest
    steps:
      - name: update behind branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh pr list --repo "$REPO" --state open \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("lul-")) | [.number, .headRefName] | @tsv' \
          | while IFS=$'\t' read -r number branch; do
              # Staleness is measured with the compare API, NOT `mergeStateStatus`.
              #
              # LUL-380, measured 2026-08-19: across the 12 most recent runs of this
              # workflow, `update-branch` was attempted exactly ZERO times -- it had
              # never once done its job. Two independent reasons, both fixed here by
              # not reading `mergeStateStatus` at all:
              #
              # 1. It is computed lazily. GitHub invalidates every open PR's merge
              #    state on a push to `main` and recomputes on demand, so during the
              #    `push: [main]` run -- the exact moment this workflow is designed to
              #    fire -- every PR reports UNKNOWN. The old `!= BEHIND` test then
              #    skipped all of them. The most recent run skipped all 9 open PRs
              #    that way ("is UNKNOWN; skipping" x9).
              # 2. It is a single enum, so it reports only the *first* problem. A PR
              #    that is behind AND has a pending check reports BLOCKED; one that is
              #    behind AND conflicted reports DIRTY. Both mask the staleness, so
              #    even the scheduled run (which does see computed values) missed them:
              #    PR #67 was 7 commits behind while reporting DIRTY.
              #
              # `compare/main...branch` is always computed, never UNKNOWN, and reports
              # `behind_by` independently of review state and check state.
              behind="$(gh api "repos/$REPO/compare/main...$branch" --jq '.behind_by' 2>/tmp/compare-err.log || true)"
              if ! printf '%s' "$behind" | grep -qE '^[0-9]+$'; then
                echo "::warning::#$number ($branch): could not read behind_by from the compare API; skipping this pass."
                cat /tmp/compare-err.log
                continue
              fi

              if [ "$behind" -eq 0 ]; then
                echo "::notice::#$number ($branch) is up to date with main; skipping."
                continue
              fi

              echo "::notice::#$number ($branch) is $behind commit(s) BEHIND main; requesting update-branch."
              if gh api -X PUT "repos/$REPO/pulls/$number/update-branch" >/dev/null 2>/tmp/update-err.log; then
                echo "::notice::#$number updated."

                # The merge commit above is GITHUB_TOKEN-authored, so it gets
                # no push/pull_request CI run (see LUL-439 comment at top of
                # file). workflow_dispatch is exempt from that suppression --
                # use it to get CI onto the new head.
                #
                # LUL-743: workflow-guard-check.yml is dispatched here too,
                # not just ci.yml. It isn't a required check on main yet
                # (LUL-610), but it declares workflow_dispatch: and runs on
                # every push already (LUL-610 dropped its paths filter), so
                # dispatching it now costs nothing and closes the gap ahead
                # of the ruleset flip: once LUL-610 lands, a backmerged head
                # would otherwise have CI green but "workflow guard check"
                # permanently MISSING -- the exact blind spot LUL-439 fixed
                # for ci.yml, reintroduced for this check.
                for workflow in ci.yml workflow-guard-check.yml; do
                  if gh api -X POST "repos/$REPO/actions/workflows/$workflow/dispatches" -f "ref=$branch" >/tmp/dispatch-err.log 2>&1; then
                    echo "::notice::$workflow dispatched on $branch for the refreshed head."
                  else
                    echo "::warning::workflow_dispatch of $workflow failed for #$number ($branch); its required checks (if any) will read MISSING on the new head until a manual dispatch or real push covers it:"
                    cat /tmp/dispatch-err.log
                  fi
                done
              else
                echo "::warning::update-branch failed for #$number -- likely a real merge conflict, needs a manual backmerge:"
                cat /tmp/update-err.log

                if ! gh pr view "$number" --repo "$REPO" --json comments \
                     --jq '.comments[].body' | grep -qF '<!-- PR_FRESHNESS_CONFLICT -->'; then
                  printf '%s\n' \
                    '<!-- PR_FRESHNESS_CONFLICT -->' \
                    "PR freshness check: this branch is behind \`main\` and \`update-branch\` could not" \
                    'fast-forward it automatically -- most likely a real merge conflict. Needs a' \
                    'manual backmerge (`git fetch origin main && git merge FETCH_HEAD`, resolve, push --' \
                    'never force-push). See systems/lullwood-checkout and decisions/0010-no-force-push' \
                    'in the wiki.' > /tmp/conflict-comment.md
                  gh pr comment "$number" --repo "$REPO" --body-file /tmp/conflict-comment.md || true
                else
                  echo "::notice::already flagged the conflict on #$number; not commenting again."
                fi
              fi
            done

      - name: approve parked action_required runs (same-repo branches only)
        # Runs after the backmerge step, not before: an `update-branch` call
        # above triggers its own PR-synchronize `pull_request` run, which
        # lands parked exactly like the original-open case this step exists
        # to clear. Running last catches both in one pass instead of leaving
        # backmerge-spawned runs for the next scheduled cycle.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh api "repos/$REPO/actions/runs?status=action_required&per_page=100" \
          | jq -r --arg repo "$REPO" \
              '.workflow_runs[] | select(.event == "pull_request" and (.head_repository.full_name // "") == $repo) | "\(.id)\t\(.head_branch)"' \
          | while IFS=$'\t' read -r run_id branch; do
              echo "::notice::approving parked run $run_id on same-repo branch $branch"
              if ! gh api -X POST "repos/$REPO/actions/runs/$run_id/approve" >/dev/null 2>/tmp/approve-err.log; then
                echo "::warning::could not approve run $run_id ($branch):"
                cat /tmp/approve-err.log
              fi
            done
