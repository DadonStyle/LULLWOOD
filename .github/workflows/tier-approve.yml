name: Tier approve

# Development-first directive (2026-08-29, AGENTS.md § Review tiers).
#
# THE PROBLEM THIS SOLVES
#
# The directive says Tier A ships on green and Tier B merges on green with the
# review landing after. Neither can happen: `release/next`'s ruleset (21050378)
# carries `required_approving_review_count: 1` with `bypass_actors: []`, so
# GitHub holds every PR at REVIEW_REQUIRED regardless of what any policy
# document says. Measured 2026-08-29: eight PRs sat MERGEABLE/BLOCKED, none
# failing anything, all waiting on the one Code Reviewer.
#
# This records the approval the tier already grants -- it does not invent one.
#
# WHY THIS IS NOT A REVIEW BYPASS
#
# It reuses bot-approve.yml's guards verbatim and adds a tier gate on top:
#
#   1. TIER GATE. scripts/pr-tier.mjs classifies the changed files and this
#      job exits without approving unless the whole diff is Tier A or B. That
#      script fails closed: `.github/**`, `scripts/**`, `engine/**`,
#      `app/api/**`, dependency manifests, and any unrecognised path are C.
#      It cannot approve a change to itself or to the merge gate.
#   2. NEVER SELF-APPROVES. Refuses if the PR was authored by the same login
#      the approving review is submitted under (the real 422 case). Every PR
#      in this repo is opened by auto-pr.yml as github-actions[bot], and the
#      approval below is submitted under SHIP_REVIEW_PAT -- a distinct
#      identity -- so this guard is keyed to whatever login `gh api user`
#      resolves for that token, not a hardcoded "github-actions[bot]". See
#      LUL-1334 / wiki systems/tier-approve-inert: keying this to the bot name
#      instead of the approving identity is what made every PR match "author
#      == github-actions[bot]" and skip guard 2 unconditionally, since
#      auto-pr.yml is what opens every PR here.
#   3. NEVER SUBSTITUTES FOR CI. Every check the BASE branch's ruleset requires
#      must already be SUCCESS on this PR's rollup, matched BY NAME against the
#      ruleset -- not via statusCheckRollup's `isRequired`, which is null for
#      every check on this repo (rulesets, not classic branch protection) and
#      would yield an empty set that trivially passes an "all green" test.
#      See wiki systems/ci-github-token-blind-spot.
#   4. IDEMPOTENT. Exits quietly if an approving review already exists.
#
# Tier C is untouched: engine simulation, persistence, secrets, CI and merge
# rules all keep their blocking human review.
#
# TRIGGER
#
# `check_suite:completed` was the original trigger and never fired: GitHub
# does not dispatch check_suite for a suite that GitHub Actions itself created
# (recursion guard, see "Events that trigger workflows" docs), and every
# required check in this repo (unit tests, etc.) is an Actions-run check
# suite. That held even after landing this file on `main` -- default-branch
# placement fixes the *other* known trap (systems/scheduled-workflow-reads-
# default-branch) but not this one. `workflow_run` does not carry that
# specific restriction and is the trigger automerge.yml already uses,
# successfully, for the identical "re-evaluate once CI finishes" need -- so
# this reuses that proven path instead of inventing a second one. Like
# `check_suite`, `workflow_run` is read from the default branch, so this file
# still has to live on `main` to fire at all (LUL-1334).
#
# CHECKOUT REF (LUL-1339)
#
# Landing the file on `main` made `workflow_run` dispatch (confirmed: 13 runs
# since the LUL-1334 hotfix), but every run against a real candidate PR still
# crashed in guard 1 with `MODULE_NOT_FOUND` on scripts/pr-tier.mjs -- zero
# approvals, same as before the fix, just a different cause. Root cause: an
# unpinned `actions/checkout` on a `workflow_run` event checks out the
# workflow FILE's own branch (`main`), not the head of the PR whose CI just
# finished -- and scripts/pr-tier.mjs has never reached `main` via a version
# cut (it exists on `release/next` only). The `ref:` pin below checks out the
# event's own head_sha for workflow_run instead, which is always a commit on
# a `lul-*` branch descended from `release/next` and therefore has the
# script. pull_request-triggered runs are untouched (github.sha already
# resolves to the correct merge ref for that trigger). Wiki:
# systems/tier-approve-checkout-ref-bug.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: tier-approve-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  approve:
    name: tier approve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # workflow_run does not inherit the triggering run's ref: an unpinned
      # checkout here resolves to the workflow FILE's own branch (main),
      # not the PR head whose CI just finished. scripts/pr-tier.mjs (guard
      # 1, below) has never reached main via a version cut, so every real
      # workflow_run-triggered approval attempt crashed with
      # MODULE_NOT_FOUND before this fix (LUL-1339, wiki
      # systems/tier-approve-checkout-ref-bug). Pinning to the event's own
      # head_sha for workflow_run leaves the pull_request trigger's default
      # merge-ref checkout untouched.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: resolve candidate PRs
        id: prs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "${PR_FROM_EVENT:-}" ]; then
            echo "$PR_FROM_EVENT" > prs.txt
          else
            gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
              --jq '.[] | select(.state == "open") | .number' > prs.txt || true
          fi
          echo "candidate PRs:"; cat prs.txt
          [ -s prs.txt ] || echo "::notice::no open PR for this event; nothing to do."

      - name: classify tier and approve
        env:
          GH_TOKEN: ${{ github.token }}
          SHIP_REVIEW_TOKEN: ${{ secrets.SHIP_REVIEW_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -s prs.txt ] || exit 0

          if [ -z "${SHIP_REVIEW_TOKEN:-}" ]; then
            echo "::error::SHIP_REVIEW_PAT secret is not configured; tier-approve cannot submit a review under a distinct identity. Refusing to approve anything this run."
            exit 0
          fi
          reviewer_login=$(GH_TOKEN="$SHIP_REVIEW_TOKEN" gh api user --jq '.login')
          echo "approving identity: $reviewer_login"

          while IFS= read -r PR; do
            [ -n "$PR" ] || continue
            echo "::group::PR #$PR"

            author=$(gh api "repos/$REPO/pulls/$PR" --jq '.user.login')
            if [ "$author" = "$reviewer_login" ]; then
              echo "::notice::PR #$PR authored by $reviewer_login, the same identity this job approves under; cannot self-approve. Skipping."
              echo "::endgroup::"; continue
            fi

            existing=$(gh api "repos/$REPO/pulls/$PR/reviews" --jq '[.[] | select(.state == "APPROVED")] | length')
            if [ "$existing" -gt 0 ]; then
              echo "::notice::PR #$PR already approved. Skipping."
              echo "::endgroup::"; continue
            fi

            # --- guard 1: tier ---
            gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' > files.txt
            echo "changed files:"; sed 's/^/  /' files.txt
            tier=$(PR_TIER_VERBOSE=1 node scripts/pr-tier.mjs --stdin < files.txt)
            echo "tier: $tier"
            if [ "$tier" = "C" ]; then
              echo "::notice::PR #$PR is Tier C -- blocking human review required. Not approving."
              echo "::endgroup::"; continue
            fi

            # --- guard 3: every ruleset-required check green, matched by name ---
            base=$(gh api "repos/$REPO/pulls/$PR" --jq '.base.ref')
            gh api "repos/$REPO/rules/branches/$(printf '%s' "$base" | sed 's|/|%2F|g')" \
              --jq '.[] | select(.type == "required_status_checks")
                        | .parameters.required_status_checks[].context' | sort -u > required.txt
            if [ ! -s required.txt ]; then
              echo "::error::$base declares no required status checks. Refusing to approve an unverified head."
              echo "::endgroup::"; continue
            fi

            gh pr view "$PR" --repo "$REPO" --json statusCheckRollup \
              --jq '.statusCheckRollup[] | "\(.name // .context)\t\(.conclusion // .state)"' > rollup.tsv

            fail=0
            while IFS= read -r ctx; do
              state=$(awk -F'\t' -v c="$ctx" '$1 == c {print $2}' rollup.tsv | tail -1)
              echo "  required '$ctx' -> ${state:-<ABSENT>}"
              [ "$state" = "SUCCESS" ] || fail=1
            done < required.txt
            if [ "$fail" -ne 0 ]; then
              echo "::notice::PR #$PR not fully green yet; will re-evaluate on the next check completion."
              echo "::endgroup::"; continue
            fi

            msg="Auto-approved as Tier $tier under the development-first directive (AGENTS.md, Review tiers). Every file in this diff classifies as Tier A or B via scripts/pr-tier.mjs, and every status check required by the $base ruleset was verified SUCCESS on this PR rollup before this review was submitted. Submitted under the studio review PAT (SHIP_REVIEW_PAT), a distinct identity from $author, the PR author, which cannot approve its own PRs. Tier C (engine simulation, persistence, secrets, CI and merge rules) is unaffected and still requires a blocking human review. See .github/workflows/tier-approve.yml"
            jq -n --arg b "$msg" '{event:"APPROVE", body:$b}' > body.json

            GH_TOKEN="$SHIP_REVIEW_TOKEN" gh api --method POST "repos/$REPO/pulls/$PR/reviews" --input body.json \
              --jq '"approved PR '"$PR"' review \(.id) state=\(.state) by=\(.user.login)"' \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done < prs.txt
