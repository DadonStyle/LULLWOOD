name: Tier approve

# Development-first directive (2026-08-29, AGENTS.md § Review tiers).
#
# THE PROBLEM THIS SOLVES
#
# The directive says Tier A ships on green and Tier B merges on green with the
# review landing after. Neither can happen: `release/next`'s ruleset (21050378)
# carries `required_approving_review_count: 1` with `bypass_actors: []`, so
# GitHub holds every PR at REVIEW_REQUIRED regardless of what any policy
# document says. Measured 2026-08-29: eight PRs sat MERGEABLE/BLOCKED, none
# failing anything, all waiting on the one Code Reviewer.
#
# This records the approval the tier already grants -- it does not invent one.
#
# WHY THIS IS NOT A REVIEW BYPASS
#
# It reuses bot-approve.yml's guards verbatim and adds a tier gate on top:
#
#   1. TIER GATE. scripts/pr-tier.mjs classifies the changed files and this
#      job exits without approving unless the whole diff is Tier A or B. That
#      script fails closed: `.github/**`, `scripts/**`, `engine/**`,
#      `app/api/**`, dependency manifests, and any unrecognised path are C.
#      It cannot approve a change to itself or to the merge gate.
#   2. NEVER SELF-APPROVES. The approval is submitted under `SHIP_REVIEW_PAT`
#      (see below), not `github.token` -- every PR here is opened by
#      auto-pr.yml under `github.token`, so approving under that same token
#      is the real 422 case (GitHub refuses an identity approving its own
#      PR). Refuses if the PR author's login matches the PAT's own login,
#      resolved at run time, not a hardcoded `github-actions[bot]` check --
#      that hardcoded form is what made this guard reject every PR (LUL-1334):
#      github-actions[bot] is always the author, so it never matched anything
#      else and the job silently did nothing.
#   3. NEVER SUBSTITUTES FOR CI. Every check the BASE branch's ruleset requires
#      must already be SUCCESS on this PR's rollup, matched BY NAME against the
#      ruleset -- not via statusCheckRollup's `isRequired`, which is null for
#      every check on this repo (rulesets, not classic branch protection) and
#      would yield an empty set that trivially passes an "all green" test.
#      See wiki systems/ci-github-token-blind-spot.
#   4. IDEMPOTENT. Exits quietly if an approving review already exists.
#
# Tier C is untouched: engine simulation, persistence, secrets, CI and merge
# rules all keep their blocking human review.
#
# THE APPROVING IDENTITY
#
# Submitted under the `SHIP_REVIEW_PAT` repo secret, the same distinct
# identity auto-pr.yml (~line 258) and automerge.yml already use to approve
# bot-authored PRs -- never `github.token`, which IS the PR author here and
# 422s approving its own PR. If the secret is not configured, this skips the
# PR with a warning rather than failing the job; nothing else in this repo
# can approve a bot-authored PR either in that case (LUL-558/LUL-960).
#
# TRIGGER
#
# check_suite:completed fires as each workflow finishes, so this re-evaluates
# on every check completion and no-ops until the full required set is green.
# That is why guard 3 is a hard gate rather than a race: the last completion
# to land is the one that finds everything SUCCESS.
#
# check_suite, like schedule, is only ever read from the DEFAULT branch
# (systems/scheduled-workflow-reads-default-branch) -- a copy of this file on
# release/next alone never receives a check_suite dispatch. This file must
# also be present on `main` to fire at all. `main` only moves via the daily
# version-cut cron (version-cut.yml, 08:53 UTC), so a fix landing on
# release/next rides the next scheduled cut rather than a manual carve-out
# (LUL-1334). Verify after that cut lands: `gh run list
# --workflow=tier-approve.yml` should show a `check_suite` event, not just
# `pull_request` -- a green run proves the guards ran, not that anything was
# approved.

on:
  check_suite:
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: tier-approve-${{ github.event.pull_request.number || github.event.check_suite.head_sha }}
  cancel-in-progress: false

jobs:
  approve:
    name: tier approve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: resolve candidate PRs
        id: prs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.check_suite.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "${PR_FROM_EVENT:-}" ]; then
            echo "$PR_FROM_EVENT" > prs.txt
          else
            gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
              --jq '.[] | select(.state == "open") | .number' > prs.txt || true
          fi
          echo "candidate PRs:"; cat prs.txt
          [ -s prs.txt ] || echo "::notice::no open PR for this event; nothing to do."

      - name: classify tier and approve
        env:
          GH_TOKEN: ${{ github.token }}
          SHIP_REVIEW_TOKEN: ${{ secrets.SHIP_REVIEW_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -s prs.txt ] || exit 0

          if [ -z "${SHIP_REVIEW_TOKEN:-}" ]; then
            echo "::warning::SHIP_REVIEW_PAT secret is not configured; no identity available to approve a bot-authored PR (LUL-558/LUL-960). Skipping every candidate."
            exit 0
          fi
          approver_login=$(GH_TOKEN="$SHIP_REVIEW_TOKEN" gh api user --jq '.login')
          echo "approving identity: $approver_login"

          while IFS= read -r PR; do
            [ -n "$PR" ] || continue
            echo "::group::PR #$PR"

            author=$(gh api "repos/$REPO/pulls/$PR" --jq '.user.login')
            if [ "$author" = "$approver_login" ]; then
              echo "::notice::PR #$PR authored by $approver_login, the same identity that would approve it; cannot self-approve. Skipping."
              echo "::endgroup::"; continue
            fi

            existing=$(gh api "repos/$REPO/pulls/$PR/reviews" --jq '[.[] | select(.state == "APPROVED")] | length')
            if [ "$existing" -gt 0 ]; then
              echo "::notice::PR #$PR already approved. Skipping."
              echo "::endgroup::"; continue
            fi

            # --- guard 1: tier ---
            gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' > files.txt
            echo "changed files:"; sed 's/^/  /' files.txt
            tier=$(PR_TIER_VERBOSE=1 node scripts/pr-tier.mjs --stdin < files.txt)
            echo "tier: $tier"
            if [ "$tier" = "C" ]; then
              echo "::notice::PR #$PR is Tier C -- blocking human review required. Not approving."
              echo "::endgroup::"; continue
            fi

            # --- guard 3: every ruleset-required check green, matched by name ---
            base=$(gh api "repos/$REPO/pulls/$PR" --jq '.base.ref')
            gh api "repos/$REPO/rules/branches/$(printf '%s' "$base" | sed 's|/|%2F|g')" \
              --jq '.[] | select(.type == "required_status_checks")
                        | .parameters.required_status_checks[].context' | sort -u > required.txt
            if [ ! -s required.txt ]; then
              echo "::error::$base declares no required status checks. Refusing to approve an unverified head."
              echo "::endgroup::"; continue
            fi

            gh pr view "$PR" --repo "$REPO" --json statusCheckRollup \
              --jq '.statusCheckRollup[] | "\(.name // .context)\t\(.conclusion // .state)"' > rollup.tsv

            fail=0
            while IFS= read -r ctx; do
              state=$(awk -F'\t' -v c="$ctx" '$1 == c {print $2}' rollup.tsv | tail -1)
              echo "  required '$ctx' -> ${state:-<ABSENT>}"
              [ "$state" = "SUCCESS" ] || fail=1
            done < required.txt
            if [ "$fail" -ne 0 ]; then
              echo "::notice::PR #$PR not fully green yet; will re-evaluate on the next check completion."
              echo "::endgroup::"; continue
            fi

            msg="Auto-approved as Tier $tier under the development-first directive (AGENTS.md, Review tiers). Every file in this diff classifies as Tier A or B via scripts/pr-tier.mjs, and every status check required by the $base ruleset was verified SUCCESS on this PR rollup before this review was submitted. Submitted under the SHIP_REVIEW_PAT identity ($approver_login), distinct from this PR's author ($author), which cannot approve its own PRs. Tier C (engine simulation, persistence, secrets, CI and merge rules) is unaffected and still requires a blocking human review. See .github/workflows/tier-approve.yml"
            jq -n --arg b "$msg" '{event:"APPROVE", body:$b}' > body.json

            GH_TOKEN="$SHIP_REVIEW_TOKEN" gh api --method POST "repos/$REPO/pulls/$PR/reviews" --input body.json \
              --jq '"approved PR '"$PR"' review \(.id) state=\(.state) by=\(.user.login)"' \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done < prs.txt
