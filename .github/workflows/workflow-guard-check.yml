name: Workflow guard check

# LUL-589. A PR that touches .github/workflows/* must not delete a guard
# that exists on main -- see systems/release-train-delivered "Trap 2" in the
# shared wiki: PR #108's branch forked before LUL-498 landed, so its copy of
# auto-pr.yml simply never mentioned deployment-budget.sh. Merging it would
# have reverted the deployment-budget guard and re-armed the exact
# deployment-amplification problem the release train exists to stop. Nobody
# reads a 27-line YAML diff looking for an absence, so this checks presence
# directly instead: .github/workflow-guards.json names markers that must
# still appear in named workflow files, and .github/scripts/workflow-guard-
# check.sh fails if one doesn't. See that script and manifest for the full
# reasoning -- this file is only the trigger/scaffold.
#
# `on: push`, not `pull_request`, for the same reason ci.yml switched:
# agent-opened PRs are opened by auto-pr.yml using GITHUB_TOKEN, and GitHub
# suppresses `pull_request` runs an action's own GITHUB_TOKEN would have
# caused (recursion guard) -- so `pull_request: opened` never fires for the
# PRs this check exists to gate. The branch push itself uses the studio's
# SSH deploy key, not GITHUB_TOKEN, so the push trigger fires normally and
# checks are matched to the PR by head SHA regardless of which event
# produced them (same reasoning as ci.yml, systems/ci-double-run).
#
# `pull_request` stays too, for forks: a fork's push never reaches Actions on
# this repo, so that's the one case the push trigger structurally cannot
# cover.
#
# LUL-610: no `paths:` filter, deliberately -- this check used to be scoped
# to `paths: ['.github/workflows/**']`, which meant it never ran (no run at
# all, not even a skipped one) on any push/PR that didn't touch a workflow
# file. That's fine for an optional check, but LUL-610 needs to add this as
# a *required* status check on main, and a required check with no run ever
# posts leaves the PR stuck "Expected -- waiting for status to be reported"
# forever for the overwhelming majority of PRs that never touch
# .github/workflows/**. Verified empirically against PR #130 (touches none
# of .github/workflows/**) before this fix: no "workflow guard check" run
# appears on its head SHA at all. Dropped the paths filter to match ci.yml's
# shape exactly -- every push/PR runs it, same as every other required
# check. The job itself is cheap (a few `grep`s), so running it
# unconditionally costs nothing worth scoping around.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keyed on event name + head SHA so a pull_request run never shares a group
# with (and cannot cancel-in-progress) the push run for the same commit.
# Unlike ci.yml, there is no fork-scope `if:` below to worry about racing
# into a skip -- see LUL-681/systems/skipped-satisfies-required-check.
concurrency:
  group: workflow-guard-check-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  guard-check:
    name: workflow guard check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # LUL-681: deliberately NO fork-scope `if:` here, unlike ci.yml. ci.yml
    # needs one because its jobs are expensive (a full Playwright suite) and
    # skipping the redundant same-repo pull_request run is worth the
    # tradeoff. That tradeoff turned out to have a sharp edge, measured live
    # on PR #137 (systems/skipped-satisfies-required-check, LUL-719): a job
    # skipped by an `if:` still posts a check run under the job's `name:`,
    # with conclusion `skipped` -- and branch protection resolves a required
    # context to the LATEST check run of that name at the head SHA, treating
    # `skipped` as satisfying it. So a same-repo PR's redundant
    # pull_request-triggered instance, if gated with `if:`, can post
    # `skipped` *after* the push-triggered instance already posted `success`,
    # silently downgrading a required context that actually ran and passed
    # into one that was never really evaluated for that instance -- exactly
    # the "required check that certifies nothing" failure mode this ticket
    # exists to close.
    #
    # This job is a few `grep`s (see the `on:` comment above) -- running it
    # a second time for a same-repo PR costs a few seconds of cheap CI, not
    # a duplicated test suite. Removing the `if:` means every instance that
    # posts under this name actually runs workflow-guard-check.sh, so every
    # instance is `success` or a real `failure`, never a vacuous `skipped`.
    # Do not reintroduce a fork-scope guard here without also solving the
    # skip-clobber problem (see LUL-719 for the general fix shape: gate at
    # the workflow level, or give the skip path a distinct job name).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # checkout@v4 does not guarantee an `origin/main` tracking ref exists
      # for a fetch-depth:0 checkout of a different branch -- fetch it
      # explicitly, same as auto-pr.yml does for release/next.
      - name: fetch main
        run: git fetch --no-tags origin main

      - name: check for a deleted guard
        run: bash .github/scripts/workflow-guard-check.sh
