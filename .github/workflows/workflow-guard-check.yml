name: Workflow guard check

# LUL-589. A PR that touches .github/workflows/* must not delete a guard
# that exists on main -- see systems/release-train-delivered "Trap 2" in the
# shared wiki: PR #108's branch forked before LUL-498 landed, so its copy of
# auto-pr.yml simply never mentioned deployment-budget.sh. Merging it would
# have reverted the deployment-budget guard and re-armed the exact
# deployment-amplification problem the release train exists to stop. Nobody
# reads a 27-line YAML diff looking for an absence, so this checks presence
# directly instead: .github/workflow-guards.json names markers that must
# still appear in named workflow files, and .github/scripts/workflow-guard-
# check.sh fails if one doesn't. See that script and manifest for the full
# reasoning -- this file is only the trigger/scaffold.
#
# `on: push`, not `pull_request`. NO `pull_request` trigger at all -- see
# LUL-729/LUL-719 (systems/ci-double-run) before re-adding one.
#
# Agent-opened PRs are opened by auto-pr.yml using GITHUB_TOKEN, and GitHub
# suppresses `pull_request` runs an action's own GITHUB_TOKEN would have
# caused (recursion guard) -- so `pull_request: opened` never fires for the
# PRs this check exists to gate. The branch push itself uses the studio's
# SSH deploy key, not GITHUB_TOKEN, so the push trigger fires normally and
# checks are matched to the PR by head SHA regardless of which event
# produced them (same reasoning as ci.yml, systems/ci-double-run).
#
# `pull_request` used to stay too, scoped to forks the same way ci.yml
# scoped it via a job-level `if:`. LUL-719 measured live on PR #137 (head
# `b07aa589`) that this is a required-status-check bypass, not just a
# wasteful duplicate: `approve-parked-runs.yml` (formerly `pr-freshness.yml`,
# LUL-778) unparks the bot-authored
# `pull_request` run's `action_required` gate (LUL-463) at an unpredictable
# later time, and branch protection resolves a required check by its LATEST
# instance, treating `skipped` as passing -- so a late `skipped` instance
# from a same-repo `pull_request` run can land on top of an EARLIER real
# instance (including a real `failure`) under the identical required-check
# name. `workflow guard check` was the sharpest case measured: on #137 it
# had NO successful instance at all, only the skipped one -- the gate was
# fully vacuous for that context. A job-level `if:` cannot fix this because
# GitHub still publishes a `skipped` check-run under the job's static name
# even when the job body never executes, and a conditional `name:` doesn't
# evaluate for a skipped job either (systems/ci-jobname-expr-literal). Same
# named, deliberate consequence as ci.yml: a genuine fork PR touching
# .github/workflows/** loses automatic coverage from this check; fall back
# to a manual `workflow_dispatch` against the fork's head ref. Zero fork PRs
# received in this repo's history as of this writing.
#
# LUL-610: no `paths:` filter, deliberately -- this check used to be scoped
# to `paths: ['.github/workflows/**']`, which meant it never ran (no run at
# all, not even a skipped one) on any push/PR that didn't touch a workflow
# file. That's fine for an optional check, but it's a *required* status check
# on main, and a required check with no run ever posts leaves the PR stuck
# "Expected -- waiting for status to be reported" forever. The job is cheap
# (a few `grep`s), so running unconditionally costs nothing worth scoping
# around. (LUL-610 removed paths; LUL-729 then removed pull_request entirely.)
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# LUL-894: was keyed on event name + head SHA, which cannot cancel a
# superseded run -- two pushes in quick succession have different SHAs, so
# they land in different concurrency groups. See ci.yml's concurrency
# comment and wiki systems/ci-concurrency-key-outlived-premise for the full
# measurement and rationale (identical defect and identical fix, shared with
# ci.yml). Keyed on `github.ref` instead; `github.event_name` stays so a
# manual `workflow_dispatch` never races a concurrent push to the same ref.
concurrency:
  group: workflow-guard-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-check:
    name: workflow guard check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # checkout@v4 does not guarantee an `origin/main` tracking ref exists
      # for a fetch-depth:0 checkout of a different branch -- fetch it
      # explicitly, same as auto-pr.yml does for release/next.
      - name: fetch main
        run: git fetch --no-tags origin main

      - name: check for a deleted guard
        run: bash .github/scripts/workflow-guard-check.sh
