name: Auto merge

# The fallback path for auto-pr.yml. `gh pr merge --auto` only works when
# "Allow auto-merge" is enabled in repo settings; this workflow does not need
# that setting. It fires when CI finishes on a `lul-*` branch and merges the
# open PR if CI was green and any commit in the PR asked to ship.
#
# Branch protection still adjudicates the merge: if either required check is
# missing or red, the API call fails and the PR stays open. This workflow
# cannot bypass the ruleset — GITHUB_TOKEN is not a bypass actor.
#
# The ruleset also requires one approving review with no bypass actor, which a
# `[ship]` PR never has *from the Code Reviewer* (skipping the Code Reviewer
# is the point of `[ship]`) -- but by the time this job runs, something else
# has usually already supplied one: bot-approve.yml (LUL-797), or the Code
# Reviewer approving directly under the studio PAT, which is not a
# self-approval collision for a bot-authored PR (PAT and github-actions[bot]
# are distinct identities). The merge step below checks the PR's existing
# reviews FIRST, matched to the exact head sha CI just tested, and only
# submits a review of its own -- scoped to exactly the diff ship-allowed.sh
# already permits (LUL-558) -- when none exists (LUL-912). Without some
# approving review at the current head, the merge call fails unconditionally,
# regardless of how green CI is or how fresh the branch is.
#
# The self-submitted fallback review MUST come from a different identity than
# the PR author, or GitHub 422s with "Review Can not approve your own pull
# request" (systems/github-access "Self-approval"). Every `[ship]` PR on the
# self-serve path is authored by `github-actions[bot]` (auto-pr.yml uses
# `github.token` too), so that fallback step cannot reuse `github.token` -- it
# needs the studio PAT, wired in as the `SHIP_REVIEW_PAT` repo secret
# specifically for this step. That secret has never been configured on this
# repo (systems/ship-never-merges-review-count-gap), so in practice the
# pre-existing-review check above is what actually lets a `[ship]` PR merge
# today; the SHIP_REVIEW_PAT path exists as the fail-closed fallback for the
# rare PR that reaches this job with no review at all yet. `gh pr merge` and
# everything else in this job stays on `github.token`. See
# systems/ship-never-merges-review-count-gap, 2026-08-20 CHANGES REQUESTED
# entry (LUL-584) for the incident this fixes, and LUL-912 for why the
# fallback alone was never enough.
#
# NOTE: This self-approval constraint on the fallback step is specific to
# BOT-authored PRs. For human-authored PRs (e.g. authored by `DadonStyle`),
# GITHUB_TOKEN is a distinct identity and CAN submit an approving review. See
# bot-approve.yml, which uses this exact mechanism (LUL-797/LUL-807). No
# extra PAT is needed for that path.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: merge if green and shipped
    # A GITHUB_TOKEN-authored backmerge head never gets a `push` run -- GitHub
    # suppresses push/pull_request events for GITHUB_TOKEN-authored commits, so the
    # now-deleted `pr-freshness.yml` backmerge step used to explicitly workflow_dispatch
    # CI on the new head instead (systems/ci-github-token-blind-spot, LUL-439). A
    # push-only guard here silently skipped every one of those, which was a standing
    # cause of "APPROVED + green + nobody merged it" (LUL-692). This branch of the
    # condition accepts that workflow_dispatch green too, but only when
    # github-actions[bot] triggered it -- that was the exact signature of the
    # pr-freshness remedy and nothing else. LUL-778 (2026-08-27) deleted the backmerge
    # step itself (it bought mergeability the repo never needed, per that ticket), so
    # this branch is now dormant rather than removed -- routine staleness no longer
    # produces a GITHUB_TOKEN head to rescue, but a future automated dispatch in this
    # same shape would still need this path. A human/agent manually dispatching CI on a
    # red branch must not be able to paint it green this way
    # (playbooks/ci-green-from-workflow-dispatch).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'lul-') &&
      (
        github.event.workflow_run.event == 'push' ||
        (
          github.event.workflow_run.event == 'workflow_dispatch' &&
          github.event.workflow_run.triggering_actor.login == 'github-actions[bot]'
        )
      )
    runs-on: ubuntu-latest
    steps:
      # `main`, not the branch under test: this is where the merge gate is read
      # from, so it must come from a ref the branch cannot edit.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: merge if green and shipped
        env:
          GH_TOKEN: ${{ github.token }}
          SHIP_REVIEW_TOKEN: ${{ secrets.SHIP_REVIEW_PAT }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # This job runs as `workflow_run`, checked out at `main` (see the step
          # above) -- its own check-run therefore attaches to `main`'s sha, never
          # to the PR branch's head. Nothing this job logs with `::warning::` or
          # `::notice::` is visible anywhere on the PR itself; a human would have
          # to know to go find this specific workflow in the Actions tab (LUL-536).
          # From the point past which we've committed to trying to merge (valid
          # marker on this exact head, CI green) any further decline needs to say
          # so somewhere the PR's own page shows -- a comment. Posted once per PR
          # per marker so re-runs on later pushes don't spam it, same pattern as
          # auto-pr.yml's SHIP_DENIED/SHIP_MALFORMED.
          comment_once() {
            local marker="$1" body_file="$2"
            if gh pr view "$number" --json comments --jq '.comments[].body' \
                 | grep -qF "$marker"; then
              echo "::notice::already explained ($marker) on #$number; not commenting again."
              return 0
            fi
            gh pr comment "$number" --body-file "$body_file" || true
          }

          number="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            echo "::notice::no open PR for $BRANCH; nothing to merge."
            exit 0
          fi

          # Only merge what CI actually tested. If the PR moved on since this
          # run started, the newer push has its own CI and its own shot at this.
          #
          # This has to run BEFORE the marker check, not after: the marker is now
          # read from live PR state (the commit list below) rather than from the
          # sha CI tested, so without this gate first we could ship intent that
          # arrived after CI ran. Same assertion as before, moved earlier.
          pr_head="$(gh pr view "$number" --json headRefOid --jq '.headRefOid')"
          if [ "$pr_head" != "$HEAD_SHA" ]; then
            echo "::notice::#$number moved to $pr_head since CI ran on $HEAD_SHA; skipping."
            exit 0
          fi

          # The marker must be a line of its own -- a substring test also matches
          # commits that merely discuss shipping. Must stay identical to the test
          # in auto-pr.yml; if these two ever disagree, a PR merges down one path
          # and not the other.
          #
          # Read it from EVERY commit in the PR, not just the head commit (LUL-465).
          # Backmerging main into the branch is the standard way to track main
          # (decisions/0010-no-force-push); an agent runs it by hand (LUL-778 deleted
          # the workflow that used to do this automatically, since routine staleness
          # never actually blocked a merge here), so the head commit is often a
          # "Merge branch 'main' into ..." commit that never carries the marker.
          # Reading only the head silently and permanently disarmed self-merge for any
          # PR that outlived one main push. The PR's own commit list is exactly
          # main..HEAD; backmerge commits come along and are harmlessly ignored by the
          # exact-line regex.
          messages="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number/commits" --paginate --jq '.[].commit.message')"
          if ! printf '%s\n' "$messages" | grep -qE '^[[:space:]]*\[ship\][[:space:]]*$'; then
            echo "::notice::#$number has no [ship] marker; leaving it open."
            exit 0
          fi

          # Release-train ancestor-repair PRs (branch-name convention: any
          # `lul-*` branch with a `-train-` segment, e.g. `lul-train-sync`,
          # `lul-train-resolve`, `lul-1041-train-repair` -- PR #222/#223/#225)
          # exist ONLY to carry a real merge commit recording main as an
          # ancestor of release/next after a cut was wrongly squashed.
          # Squashing one discards the exact parent edge it exists to create,
          # reproducing the break it was meant to fix (LUL-962/LUL-978/
          # LUL-1041, verified three times: #222, #223, and #225 were all
          # real `--no-ff` merges and all three got squashed anyway -- #225 by
          # auto-pr.yml's own native auto-merge arm before this job ever ran,
          # so the matching guard also lives there). Branch name, not PR
          # title -- auto-pr.yml derives the PR title from the head commit's
          # subject line, which has no fixed convention and is exactly why a
          # title-based version of this check (this job's first attempt)
          # missed PR #225.
          merge_method=squash
          if printf '%s' "$BRANCH" | grep -qE '^lul-([0-9]+-)?train-'; then
            merge_method=merge
            echo "::notice::#$number ($BRANCH) is a release-train repair branch; will merge with --merge, not --squash (LUL-1041)."
          fi

          # `[ship]` skips the Code Reviewer, so it only covers diffs where a
          # green CI run is genuinely the whole quality bar.
          # Fail closed if the gate is missing rather than merging ungated. This
          # should not happen in normal operation -- if it does, silence would
          # look identical to "nothing to do here," so say it on the PR too.
          if [ ! -x ./.github/scripts/ship-allowed.sh ]; then
            echo "::warning::no ship-allowed.sh on main; refusing to auto-merge #$number."
            printf '%s\n' \
              '<!-- SHIP_NO_ALLOWLIST -->' \
              '`[ship]` is on this branch and CI is green, but `main` has no' \
              '`.github/scripts/ship-allowed.sh` to check it against, so this refuses' \
              'to self-merge rather than shipping ungated. This should not happen in' \
              'normal operation -- if you are seeing this, the allowlist script itself' \
              'is missing from `main`.' > /tmp/ship-no-allowlist.md
            comment_once 'SHIP_NO_ALLOWLIST' /tmp/ship-no-allowlist.md
            exit 0
          fi

          # auto-pr.yml applies the same gate at push time and comments
          # SHIP_DENIED there if it fails; this re-checks at merge time because
          # `gh pr view --json files` reflects the PR's *current* base, which can
          # differ from what auto-pr.yml saw at push. comment_once skips posting
          # a duplicate when auto-pr.yml already explained it.
          if ! blocked="$(gh pr view "$number" --json files --jq '.files[].path' \
                          | ./.github/scripts/ship-allowed.sh)"; then
            echo "::warning::#$number carries [ship] but changes files that need the Code Reviewer:"
            printf '  %s\n' "$blocked"
            printf '%s\n' \
              '<!-- SHIP_DENIED -->' \
              '`[ship]` was found on a commit in this branch, but the branch changes files' \
              'outside the docs/CI/tests allowlist, so it will **not** self-merge:' \
              '' \
              "$(printf '%s\n' "$blocked" | sed 's/^/- `/; s/$/`/')" \
              '' \
              'This is not a failure — the PR is open and CI is running. It needs a' \
              '`REVIEW: APPROVED` from the Code Reviewer, then someone merges it.' \
              'Policy: LUL-73. Allowlist: `.github/scripts/ship-allowed.sh`.' > /tmp/ship-denied.md
            comment_once 'SHIP_DENIED' /tmp/ship-denied.md
            exit 0
          fi

          # required_approving_review_count:1 has no bypass actor on this repo
          # (bypass_actors: [], current_user_can_bypass: "never" for this same
          # token) -- the merge call below fails unconditionally on a PR with
          # zero reviews, no matter how green CI is or how fresh the branch is.
          # `[ship]` PRs have zero reviews *from the Code Reviewer* by design,
          # since skipping the Code Reviewer is the whole point -- but that
          # does not mean zero reviews outright. bot-approve.yml (LUL-797) and
          # the Code Reviewer's own PAT-authored `gh pr review --approve` (the
          # normal path for a bot-authored PR, which every self-serve `[ship]`
          # PR is -- PAT and github-actions[bot] are distinct identities, so
          # that is not self-approval) can both already have supplied one
          # before this job ever runs. LUL-912: check for that first, and only
          # fall through to submitting our own review -- gated on the
          # never-configured SHIP_REVIEW_PAT secret -- when none exists.
          #
          # Match on commit_id == pr_head, not merely "has an approval": a
          # stale approval from an earlier head must not unlock a merge (the
          # branch could have changed materially since that review, even if
          # this exact CI run was on the current head).
          fresh_approval="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number/reviews" --paginate \
            | jq --arg sha "$pr_head" '[.[] | select(.state == "APPROVED" and .commit_id == $sha)] | length')"

          if [ "$fresh_approval" -gt 0 ]; then
            echo "::notice::#$number already has an APPROVED review at head $pr_head (from bot-approve.yml or the Code Reviewer); skipping self-review."
          else
            # required_approving_review_count:1 has no bypass actor on this repo
            # (bypass_actors: [], current_user_can_bypass: "never" for this same
            # token) -- the merge call below fails unconditionally on a PR with
            # zero reviews, no matter how green CI is or how fresh the branch is.
            # This is not a code-quality review -- it is the record that
            # ship-allowed.sh vetted this exact file set, on this exact head,
            # in this same step (never an earlier job's result: main and the
            # PR can both have moved). See LUL-558 /
            # systems/ship-never-merges-review-count-gap.
            #
            # Approve only, never approve-and-force -- every other blocking rule
            # (checks, strict up-to-date) still applies below and must still
            # block, loudly, on its own merits.
            #
            # Must run under SHIP_REVIEW_TOKEN (the studio PAT), never GH_TOKEN --
            # GH_TOKEN is github.token, the same identity that authored this PR
            # (auto-pr.yml opens it under github.token too), and GitHub 422s an
            # identity approving its own PR unconditionally. See the file header.
            #
            # SHIP_REVIEW_PAT has never been configured on this repo
            # (systems/ship-never-merges-review-count-gap) and this path is
            # therefore expected to fail closed here every time until it is --
            # which is why comment_once was dropped for this marker (LUL-912):
            # deduping "once per PR" made every recurrence after the first
            # completely silent, and this refusal recurs on every CI run.
            if [ -z "${SHIP_REVIEW_TOKEN:-}" ]; then
              echo "::warning::SHIP_REVIEW_PAT secret is not configured, and #$number has no pre-existing APPROVED review at head $pr_head; refusing to auto-merge."
              printf '%s\n' \
                '<!-- SHIP_REVIEW_FAILED -->' \
                '`[ship]` is valid, CI was green, and the allowlist passed, but this PR has' \
                'no APPROVED review at head `'"$pr_head"'` yet (from `bot-approve.yml` or the' \
                'Code Reviewer), and this repo has no `SHIP_REVIEW_PAT` secret configured, so' \
                'there is no identity available to submit one itself, distinct from this PR'"'"'s' \
                'author (`github-actions[bot]`). Refusing to try an ungated merge. LUL-558 / LUL-912.' > /tmp/ship-review-failed.md
              gh pr comment "$number" --body-file /tmp/ship-review-failed.md || true
              exit 1
            fi
            if ! GH_TOKEN="$SHIP_REVIEW_TOKEN" gh pr review "$number" --approve \
                 --body "Auto-approved: \`[ship]\` + \`ship-allowed.sh\` passed for this exact head (\`$pr_head\`). Policy: LUL-558."; then
              echo "::warning::could not submit the required approving review on #$number; refusing to auto-merge."
              printf '%s\n' \
                '<!-- SHIP_REVIEW_FAILED -->' \
                '`[ship]` is valid, CI was green, and the allowlist passed, but submitting' \
                'the required approving review itself failed, so this refuses to try an' \
                'ungated merge. Check the "Auto merge" workflow run log. LUL-558 / LUL-912.' > /tmp/ship-review-failed.md
              gh pr comment "$number" --body-file /tmp/ship-review-failed.md || true
              exit 1
            fi
          fi

          if gh pr merge "$number" --"$merge_method" --delete-branch; then
            echo "::notice::merged #$number"
          else
            # Expected when the branch is behind main: the ruleset requires
            # strict up-to-date branches, so the agent must rebase and re-push.
            echo "::warning::merge of #$number was refused — most likely the branch is behind main and needs a rebase."
            printf '%s\n' \
              '<!-- SHIP_MERGE_FAILED -->' \
              '`[ship]` is valid, CI was green, and the allowlist passed, but the merge' \
              'API call itself was refused. The most likely cause is `main` moving under' \
              'this branch between CI finishing and this step running -- the ruleset' \
              'requires an up-to-date branch (`strict`).' \
              '' \
              'Backmerge and re-push to give this another shot:' \
              '' \
              '```bash' \
              'git fetch --no-tags origin main && git merge FETCH_HEAD' \
              "git push origin HEAD:refs/heads/$BRANCH" \
              '```' \
              '' \
              'Posted once per PR -- if this keeps happening on later pushes, treat this' \
              'comment as stale and check the "Auto merge" workflow run log directly.' > /tmp/ship-merge-failed.md
            comment_once 'SHIP_MERGE_FAILED' /tmp/ship-merge-failed.md
            exit 1
          fi
