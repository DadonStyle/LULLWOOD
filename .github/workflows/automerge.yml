name: Auto merge

# The fallback path for auto-pr.yml. `gh pr merge --auto` only works when
# "Allow auto-merge" is enabled in repo settings; this workflow does not need
# that setting. It fires when CI finishes on a `lul-*` branch and merges the
# open PR if CI was green and any commit in the PR asked to ship.
#
# Branch protection still adjudicates the merge: if either required check is
# missing or red, the API call fails and the PR stays open. This workflow
# cannot bypass the ruleset — GITHUB_TOKEN is not a bypass actor.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: merge if green and shipped
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'lul-')
    runs-on: ubuntu-latest
    steps:
      # `main`, not the branch under test: this is where the merge gate is read
      # from, so it must come from a ref the branch cannot edit.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: merge if green and shipped
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          number="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            echo "::notice::no open PR for $BRANCH; nothing to merge."
            exit 0
          fi

          # Only merge what CI actually tested. If the PR moved on since this
          # run started, the newer push has its own CI and its own shot at this.
          #
          # This has to run BEFORE the marker check, not after: the marker is now
          # read from live PR state (the commit list below) rather than from the
          # sha CI tested, so without this gate first we could ship intent that
          # arrived after CI ran. Same assertion as before, moved earlier.
          pr_head="$(gh pr view "$number" --json headRefOid --jq '.headRefOid')"
          if [ "$pr_head" != "$HEAD_SHA" ]; then
            echo "::notice::#$number moved to $pr_head since CI ran on $HEAD_SHA; skipping."
            exit 0
          fi

          # The marker must be a line of its own -- a substring test also matches
          # commits that merely discuss shipping. Must stay identical to the test
          # in auto-pr.yml; if these two ever disagree, a PR merges down one path
          # and not the other.
          #
          # Read it from EVERY commit in the PR, not just the head commit (LUL-465).
          # Backmerging main into the branch is the standard way to track main
          # (decisions/0010-no-force-push) and pr-freshness.yml does it automatically,
          # so the head commit is routinely a "Merge branch 'main' into ..." commit
          # that never carries the marker. Reading only the head silently and
          # permanently disarmed self-merge for any PR that outlived one main push.
          # The PR's own commit list is exactly main..HEAD; backmerge commits come
          # along and are harmlessly ignored by the exact-line regex.
          messages="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number/commits" --paginate --jq '.[].commit.message')"
          if ! printf '%s\n' "$messages" | grep -qE '^[[:space:]]*\[ship\][[:space:]]*$'; then
            echo "::notice::#$number has no [ship] marker; leaving it open."
            exit 0
          fi

          # `[ship]` skips the Code Reviewer, so it only covers diffs where a
          # green CI run is genuinely the whole quality bar. auto-pr.yml applies
          # the same gate and explains it on the PR; this is the fallback path,
          # so it enforces silently rather than commenting twice.
          # Fail closed if the gate is missing rather than merging ungated.
          if [ ! -x ./.github/scripts/ship-allowed.sh ]; then
            echo "::warning::no ship-allowed.sh on main; refusing to auto-merge #$number."
            exit 0
          fi

          if ! blocked="$(gh pr view "$number" --json files --jq '.files[].path' \
                          | ./.github/scripts/ship-allowed.sh)"; then
            echo "::warning::#$number carries [ship] but changes files that need the Code Reviewer:"
            printf '  %s\n' "$blocked"
            exit 0
          fi

          if gh pr merge "$number" --squash --delete-branch; then
            echo "::notice::merged #$number"
          else
            # Expected when the branch is behind main: the ruleset requires
            # strict up-to-date branches, so the agent must rebase and re-push.
            echo "::warning::merge of #$number was refused — most likely the branch is behind main and needs a rebase."
            exit 1
          fi
