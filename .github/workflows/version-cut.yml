name: Version cut

# Implements LUL-492's step 4 (the version-cut workflow): batches everything
# currently sitting on `release/next` into `main` on a cadence, instead of
# every feature PR hitting `main` directly (systems/release-train).
#
# `release/next`'s ruleset has `strict_required_status_checks_policy: false`
# (systems/release-train), so PRs land there in parallel and merging one no
# longer invalidates every other open PR's checks. What that trades away --
# "every change was tested against the exact final tree" -- is bought back
# here: this workflow builds the real release/next+main merge tree and
# re-runs the full suite against it before the cut PR is ever offered for
# review. `main`'s required checks are SHA-scoped (this repo has no merge
# queue), so left alone they'd just replay whatever last passed on
# release/next's own tip -- not the combined result -- which is why this
# can't be left to ci.yml's normal pull_request/push triggers.
#
# This workflow never merges anything into `main`. It only opens or refreshes
# the cut PR and reports the combined-suite result on it. Merging needs a
# full-version Code Reviewer pass scoped to cross-PR collisions (LUL-492
# §3.4) -- ship-allowed.sh denies `.github/workflows/*` outright, and the same
# bar applies to a PR that touches the whole tree at once. See
# systems/release-train and playbooks/review-protocol in the shared wiki.

on:
  schedule:
    # at least once a day, per LUL-492 §1
    - cron: '53 8 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Open a cut PR even if release/next has nothing new (for testing this workflow)'
        type: boolean
        default: false
  push:
    branches: [release/next]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: version-cut
  cancel-in-progress: false

jobs:
  decide:
    name: decide whether to cut
    runs-on: ubuntu-latest
    if: github.repository == 'DadonStyle/LULLWOOD'
    outputs:
      should_cut: ${{ steps.check.outputs.should_cut }}
      ahead_by: ${{ steps.check.outputs.ahead_by }}
    steps:
      - name: compare release/next against main
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail

          ahead="$(gh api "repos/${{ github.repository }}/compare/main...release/next" --jq '.ahead_by // 0')"
          echo "ahead_by=$ahead" >> "$GITHUB_OUTPUT"

          # schedule/workflow_dispatch cut on anything new -- "at least once a
          # day" is the point of the schedule. `push` (every merge landing on
          # release/next) only cuts early once the lane is K=8 PRs ahead
          # (LUL-492 §3.4); below that it's a near-free early-exit, no
          # combined-suite run, so routine feature merges don't each cost a
          # full playwright run.
          should_cut=false
          case "$EVENT" in
            workflow_dispatch)
              if [ "$FORCE" = "true" ] || [ "$ahead" -gt 0 ]; then should_cut=true; fi
              ;;
            schedule)
              if [ "$ahead" -gt 0 ]; then should_cut=true; fi
              ;;
            push)
              if [ "$ahead" -ge 8 ]; then should_cut=true; fi
              ;;
          esac
          echo "should_cut=$should_cut" >> "$GITHUB_OUTPUT"
          echo "::notice::ahead_by=$ahead event=$EVENT should_cut=$should_cut"

  combined-suite:
    name: build the merge tree and run the full suite (shard ${{ matrix.shard }}/4)
    needs: decide
    if: needs.decide.outputs.should_cut == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # LUL-927 (wiki game/lul927-smoke-suite-timing-diffuse): the suite's ~22-26min
      # green-path cost is diffuse across all 65 tests, not concentrated in a few
      # slow specs, and playwright.config.ts has run it single-worker/serial since
      # the file's first commit for no stated reason. Run serially on a merge tree
      # already contending for CPU with three.js/WebGL rendering, that turned into
      # ~100min wall-clock and ~30 cascading timeouts/CDP-connection errors on run
      # 33633069397 (LUL-1272) -- the same render-contention-under-load shape
      # LUL-554 diagnosed at smaller scale on 2026-08-20. Sharding across separate
      # runners (each its own CPU, its own fresh browser process) fixes the
      # contention without touching playwright.config.ts's workers:1 -- local and
      # per-PR runs (which don't use this workflow) are unaffected. 4-way lands
      # each shard near the suite's original single-project cost; revisit if the
      # suite grows enough to blow that budget again.
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/next
          fetch-depth: 0

      # Live fetch, not a snapshot from the `decide` job -- release/next can
      # keep taking feature merges the whole time this run is in flight, and
      # this is the state the combined-suite result actually needs to speak
      # for. Each shard re-fetches/re-merges independently (matrix jobs don't
      # share a filesystem); a push landing on main mid-run could in theory
      # skew shards onto slightly different trees, the same live-fetch
      # tradeoff this job already accepted pre-sharding, just spread across
      # more checkouts.
      - name: build the combined tree (release/next merged with main)
        run: |
          set -euo pipefail
          git config user.name  "lullwood-version-cut"
          git config user.email "version-cut@lullwood.invalid"
          git fetch --no-tags origin main
          if ! git merge --no-ff --no-edit FETCH_HEAD; then
            git merge --abort
            echo "::error::release/next conflicts with main -- needs a manual backmerge before this cut can be tested."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Non-playwright checks are identical on every shard's tree (same merge
      # commit) -- run them once, on shard 1, not 4x. A failure here still
      # fails that matrix job, which still fails the aggregate `combined-suite`
      # result the PR step below reads (`needs.combined-suite.result` is
      # 'success' only if every matrix job succeeded).
      - name: unit tests
        if: matrix.shard == 1
        run: npm test

      - name: lint
        if: matrix.shard == 1
        run: npm run lint

      # Next 16 injects generated route types; next-env.d.ts is gitignored
      # and doesn't exist in a fresh checkout (same as ci.yml's build job).
      # Every shard needs this before its own build, not just shard 1.
      - name: typegen
        run: npx next typegen

      - name: typecheck
        if: matrix.shard == 1
        run: npx tsc --noEmit

      - name: build
        run: npx next build

      - name: install playwright browsers + system deps
        run: npx playwright install --with-deps chromium

      - name: playwright smoke suite (shard ${{ matrix.shard }}/4)
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: upload playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: version-cut-playwright-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  open-or-refresh-cut-pr:
    name: open or refresh the cut PR
    needs: [decide, combined-suite]
    # Runs even if combined-suite failed -- a silent red run nobody looks at
    # is worse than a PR that says DO NOT MERGE in plain sight.
    if: always() && needs.decide.outputs.should_cut == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: open or refresh the cut PR
        env:
          GH_TOKEN: ${{ github.token }}
          SHIP_REVIEW_TOKEN: ${{ secrets.SHIP_REVIEW_PAT }}
          REPO: ${{ github.repository }}
          SUITE_RESULT: ${{ needs.combined-suite.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          number="$(gh pr list --repo "$REPO" --state open --base main --head release/next --json number --jq '.[0].number // empty')"

          if [ -z "$number" ]; then
            today="$(date -u +%Y.%m.%d)"

            # N disambiguates same-day cuts. Count existing tags for today
            # rather than trusting anything computed earlier in this run.
            n=1
            existing="$(gh api "repos/$REPO/git/matching-refs/tags/v${today}" --jq '. | length' 2>/dev/null || echo 0)"
            if [ "$existing" -gt 0 ] 2>/dev/null; then
              n=$((existing + 1))
            fi
            title="Release v${today}-${n}"

            printf '%s\n' \
              "Automated version cut (LUL-497): batches everything currently merged into" \
              '`release/next` into `main`.' \
              '' \
              '**Before this lands:**' \
              "- the combined-suite run must be green (below) -- this PR's own required" \
              '  checks reflect release/next'"'"'s last push, not the merge tree tested here,' \
              '  so they alone do not prove the combined result is safe.' \
              '- needs a full-version Code Reviewer pass scoped to cross-PR collisions' \
              '  (duplicate identifiers, contradictory tuning, two PRs touching the same' \
              '  system -- precedent: LUL-427). Open a Paperclip review child issue; this' \
              '  workflow cannot do that part.' \
              '' \
              "Combined-suite run: $RUN_URL" \
              '' \
              '**Auto-merge (founder directive, 2026-08-28):** if the combined-suite run' \
              'above is green, this workflow arms native GitHub auto-merge with a' \
              '**merge commit** (not squash, so individual PR history survives on `main`)' \
              '-- it merges itself the moment the Code Reviewer'"'"'s required approval lands' \
              'and every required check is green, no manual click needed. A red' \
              'combined-suite never gets auto-merge armed, regardless of review state --' \
              'see the DO NOT MERGE comment below if that'"'"'s the case here. See' \
              '`systems/release-train` in the shared wiki.' \
              > /tmp/cut-pr-body.md

            gh pr create --repo "$REPO" \
              --base main --head release/next \
              --title "$title" \
              --body-file /tmp/cut-pr-body.md

            number="$(gh pr list --repo "$REPO" --state open --base main --head release/next --json number --jq '.[0].number')"
            echo "::notice::opened cut PR #$number"
          else
            echo "::notice::cut PR #$number already open; not opening a duplicate."
          fi

          if [ "$SUITE_RESULT" = "success" ]; then
            comment="Combined-suite passed against the release/next+main merge tree: $RUN_URL"
          else
            comment="**DO NOT MERGE** -- combined-suite result was \`$SUITE_RESULT\` against the release/next+main merge tree: $RUN_URL. Needs investigation before this cut can land."
          fi
          gh pr comment "$number" --repo "$REPO" --body "$comment"

          # Founder directive (2026-08-28): arm auto-merge on the cut PR. This never
          # bypasses the Code Reviewer -- main's ruleset still requires their approval
          # before an armed auto-merge can actually fire -- it only removes the manual
          # "click merge" step once that approval lands. A merge commit, never squash,
          # per LUL-492 §3.4 (individual PR history must survive on main).
          #
          # ADVISORY as of 2026-09-05 (see issue #311): combined-suite failing no longer
          # blocks arming auto-merge -- it stayed red for 3+ days on stale test literals
          # unrelated to the code being cut (see PR #265/#290/#310), and a real predator-AI
          # regression (PR #251) still needed a human/Game-Tester read of the failures
          # either way, gate or no gate. The PR comment above still reports the actual
          # result in plain sight; arming just no longer waits on it. Revert this if that
          # trade stops paying off -- restore `if [ "$SUITE_RESULT" = "success" ]; then`
          # around the merge call below.
          # LUL-762: arm under SHIP_REVIEW_TOKEN when configured -- GitHub
          # attributes an auto-merge's eventual completion to whoever armed
          # it, so arming under github.token still leaves the resulting main
          # commit exempt from ci.yml's push trigger. Same fix as
          # cut-merge.yml (the manual alternative to this arm) and the
          # release/next-targeting merges.
          merge_token="${SHIP_REVIEW_TOKEN:-$GH_TOKEN}"
          if GH_TOKEN="$merge_token" gh pr merge "$number" --repo "$REPO" --auto --merge; then
            echo "::notice::auto-merge armed on cut PR #$number (merge commit, pending Code Reviewer approval; combined-suite is $SUITE_RESULT and is advisory-only)"
          else
            echo "::warning::could not arm auto-merge on cut PR #$number -- it stays open for a manual merge once reviewed."
          fi
