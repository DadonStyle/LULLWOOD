name: Auto PR

# Why this exists
# ---------------
# `main` is protected by ruleset 20886790: a PR is mandatory, direct pushes are
# rejected, and two checks must be green. Our agents authenticate to GitHub with
# an SSH deploy key, which can push refs and nothing else — it has no API scope,
# so it cannot open a pull request. Without this workflow every branch an agent
# pushes is stranded and a human has to open the PR by hand.
#
# The only channel an agent has to this repo is `git push`, so all intent rides
# in the branch name and the commit message:
#
#   git push origin HEAD:refs/heads/lul-42-my-change   -> a PR is opened for you
#   ...with "[ship]" alone on a line of any commit     -> it also merges on green
#
# "[ship]" must be the entire content of its own line, on any commit the branch
# authored (not just the head -- backmerges routinely replace the head with a
# merge commit). Appending it to a subject line does nothing.
#
# Runs as GITHUB_TOKEN, so it needs "Allow GitHub Actions to create and approve
# pull requests" (Settings -> Actions -> General -> Workflow permissions).
#
# Arming native auto-merge (`--auto`, below) hits the same required-review gap
# automerge.yml documents in its own header: required_approving_review_count:1
# has no bypass actor, and this job's own GITHUB_TOKEN is the same identity
# that authored the PR, so it cannot approve it. The `SHIP_REVIEW_PAT` secret
# (a second, distinct identity) is required before arming --auto will ever
# actually lead to a merge; until that secret is configured this step skips
# arming and leaves it to automerge.yml, which will refuse for the same
# reason and say so on the PR. LUL-558 / systems/ship-never-merges-review-count-gap.

on:
  push:
    branches: ['lul-*']

permissions:
  contents: write
  pull-requests: write
  deployments: read

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-pr:
    name: open or refresh the PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # LUL-498: fail closed at 90 deployments in the trailing 24h, holding
      # new PR opens (and refreshes) until the window rolls. This step's
      # exit code gates everything below it -- a fail-closed result here
      # stops the job before `gh pr create`/`gh pr merge` ever runs. See
      # .github/scripts/deployment-budget.sh and systems/vercel-cd in the
      # shared wiki for why GITHUB_TOKEN is enough (no VERCEL_API_TOKEN).
      - name: check deployment budget before opening or refreshing a PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/deployment-budget.sh

      - name: open or refresh the PR
        env:
          GH_TOKEN: ${{ github.token }}
          SHIP_REVIEW_TOKEN: ${{ secrets.SHIP_REVIEW_PAT }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Bounded retry for gh calls: 3 attempts, exponential backoff (2s/4s),
          # retried only on 5xx/429 -- a transient GitHub-side error, not a real
          # problem with the branch (LUL-327: a GraphQL 503 here used to red-X a
          # healthy PR and silently leave auto-merge unarmed, since nothing ever
          # retried it). Anything else (4xx, auth, bad args) fails on the first
          # try, since retrying can't fix it.
          #
          # Exhausting all attempts on a retryable error still exits non-zero --
          # do NOT change this to `|| true`. A swallowed failure here is worse
          # than a red X: it looks green while auto-merge never got armed.
          gh_retry() {
            local attempt=1 max_attempts=3 delay=2 stderr_file rc out
            stderr_file="$(mktemp)"
            while true; do
              # `rc=$?` has to sit in an explicit `else`: an `if cond; then ...; fi`
              # with no `else`, taking the false branch, itself exits 0 -- reading
              # `$?` right after the `fi` silently reads a fake success.
              if out="$("$@" 2>"$stderr_file")"; then
                cat "$stderr_file" >&2
                rm -f "$stderr_file"
                printf '%s' "$out"
                return 0
              else
                rc=$?
              fi
              if [ "$attempt" -ge "$max_attempts" ] || ! grep -qE 'HTTP (5[0-9]{2}|429)' "$stderr_file"; then
                cat "$stderr_file" >&2
                rm -f "$stderr_file"
                return "$rc"
              fi
              echo "::warning::gh_retry: attempt $attempt/$max_attempts failed with a retryable error, retrying in ${delay}s -- $*" >&2
              cat "$stderr_file" >&2
              sleep "$delay"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
          }

          # LUL-327 test hook only -- unset in every real run. Forces the first
          # gh call to fail with a fake 503 so the retry gate can be proven live
          # without waiting on an actual GitHub outage. Left in deliberately as
          # a cheap, permanent way to re-prove the gate later; it is a no-op
          # unless the workflow env explicitly sets it to "true".
          if [ "${LUL327_TEST_FORCE_5XX:-}" = "true" ]; then
            gh() { echo "HTTP 503: LUL-327 test stub -- simulated GitHub outage (not a real failure)" >&2; return 1; }
          fi

          # checkout@v4 only fetches the pushed ref, so release/next has to be asked for.
          git fetch --no-tags origin release/next

          # Nothing to propose if the branch has no commits release/next lacks.
          if [ "$(git rev-list --count FETCH_HEAD..HEAD)" = "0" ]; then
            echo "::notice::$BRANCH is not ahead of release/next; no PR to open."
            exit 0
          fi

          number="$(gh_retry gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"

          if [ -z "$number" ]; then
            printf '%s\n' \
              'Opened automatically by `.github/workflows/auto-pr.yml` because an agent' \
              'pushed this branch, and deploy keys cannot call the GitHub API.' \
              '' \
              'The two required checks run off the branch push rather than off this PR,' \
              'so look for them on the head commit.' \
              '' \
              'To have this merged automatically once both checks are green, put a' \
              '`[ship]` marker on any commit on this branch. **The marker must be a' \
              'line of its own** — `[ship]` appended to a descriptive subject line is' \
              'not recognised and will never self-merge. The simplest way to tag a' \
              'branch you have already pushed:' \
              '' \
              '```bash' \
              "git commit --allow-empty -m '[ship]' && git push" \
              '```' \
              '' \
              'This only covers docs, CI config and test-only diffs. Anything touching' \
              'game or app code goes to the Code Reviewer' \
              '(see `.github/scripts/ship-allowed.sh`).' > /tmp/pr-body.md

            gh_retry gh pr create \
              --base release/next \
              --head "$BRANCH" \
              --title "$(git log -1 --pretty=%s)" \
              --body-file /tmp/pr-body.md

            number="$(gh_retry gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
            echo "::notice::opened PR #$number for $BRANCH"
          else
            echo "::notice::PR #$number already open for $BRANCH"
          fi

          # `[ship]` is the agent's merge intent. Without it the PR just sits
          # there green, which is the right default for work-in-progress pushes.
          #
          # The marker must be a line of its own. A substring test (the original)
          # matches any commit whose message merely *discusses* shipping -- the
          # commit that introduced this very guard tripped it, which is how the
          # bug was found. Intent has to be unambiguous to be intent.
          #
          # Read it from every commit this branch authored, not just the head
          # commit (LUL-465). Backmerging main is the standard way to track main
          # (decisions/0010-no-force-push) and pr-freshness.yml does it for us, so
          # the head is routinely a merge commit that never carries the marker --
          # which silently and permanently disarmed self-merge for any PR that
          # outlived one main push. `--no-merges` drops those backmerge commits
          # (they can never carry a marker anyway); `FETCH_HEAD..HEAD` excludes
          # everything already on main. The regex below is unchanged and must
          # stay byte-identical to automerge.yml's -- only the input widens.
          messages="$(git log --no-merges FETCH_HEAD..HEAD --pretty=%B)"
          if printf '%s\n' "$messages" | grep -qE '^[[:space:]]*\[ship\][[:space:]]*$'; then

            # ...but intent is not authority. `[ship]` merges on green alone,
            # which skips the Code Reviewer, so it is scoped to diffs where
            # green really is the whole quality bar. See the script for why.
            # Run MAIN's copy of the allowlist, never the branch's. The branch
            # is the thing being judged; letting it supply its own rule is the
            # whole bypass. (The script also refuses to ship changes to itself,
            # so this is the second of two locks, not the only one.)
            # Fail CLOSED if main has no allowlist -- e.g. before this change is
            # itself merged, or if someone deletes it. No gate means no `[ship]`,
            # never "no gate means ship anything".
            if ! git show FETCH_HEAD:.github/scripts/ship-allowed.sh \
                 > "$RUNNER_TEMP/ship-allowed.sh" 2>/dev/null; then
              echo "::warning::no ship-allowed.sh on main; refusing to auto-merge #$number."
              exit 0
            fi
            chmod +x "$RUNNER_TEMP/ship-allowed.sh"

            # Three dots: diff from the merge-base, so commits that landed on
            # main since this branch forked are not counted as ours.
            if ! blocked="$(git diff --name-only FETCH_HEAD...HEAD | "$RUNNER_TEMP/ship-allowed.sh")"; then
              echo "::warning::[ship] ignored on #$number — this diff needs the Code Reviewer."

              # Every push re-runs this workflow, so say it once per PR.
              if gh_retry gh pr view "$number" --json comments \
                   --jq '.comments[].body' | grep -qF 'SHIP_DENIED'; then
                echo "::notice::already explained on #$number; not commenting again."
                exit 0
              fi

              printf '%s\n' \
                '<!-- SHIP_DENIED -->' \
                '`[ship]` was found on a commit in this branch, but the branch changes files outside' \
                'the docs/CI/tests allowlist, so it will **not** self-merge:' \
                '' \
                "$(printf '%s\n' "$blocked" | sed 's/^/- `/; s/$/`/')" \
                '' \
                'This is not a failure — the PR is open and CI is running. It needs a' \
                '`REVIEW: APPROVED` from the Code Reviewer, then someone merges it.' \
                'Policy: LUL-73. Allowlist: `.github/scripts/ship-allowed.sh`.' > /tmp/ship-denied.md
              # Best-effort: losing this comment doesn't disarm anything, it's
              # just the explanation, so it stays retried-but-non-fatal.
              gh_retry gh pr comment "$number" --body-file /tmp/ship-denied.md || true
              exit 0
            fi

            # required_approving_review_count:1 has no bypass actor on this
            # repo's ruleset, so native auto-merge would otherwise sit armed
            # forever waiting for a review a `[ship]` PR never gets by design.
            # Submit it here, under a distinct identity from the PR author
            # (github-actions[bot], same as this job) -- never GH_TOKEN, which
            # IS that author and 422s approving its own PR. See LUL-558 /
            # systems/ship-never-merges-review-count-gap and automerge.yml's
            # matching step, which this must stay in sync with.
            if [ -z "${SHIP_REVIEW_TOKEN:-}" ]; then
              echo "::warning::SHIP_REVIEW_PAT secret is not configured; not arming auto-merge on #$number. automerge.yml will refuse it too until the secret exists (LUL-558)."
            elif ! GH_TOKEN="$SHIP_REVIEW_TOKEN" gh_retry gh pr review "$number" --approve \
                 --body "Auto-approved: \`[ship]\` + \`ship-allowed.sh\` passed for this exact head. Policy: LUL-558."; then
              echo "::warning::could not submit the required approving review on #$number; not arming auto-merge. automerge.yml will get its own shot after CI."
            elif gh_retry gh pr merge "$number" --auto --squash --delete-branch; then
              echo "::notice::auto-merge armed on #$number"
            else
              # "Allow auto-merge" may be off in repo settings; automerge.yml
              # picks this up after CI instead.
              echo "::warning::could not arm auto-merge on #$number; automerge.yml will handle it once CI reports."
            fi
          elif printf '%s\n' "$messages" | grep -qF '[ship]'; then
            # LUL-465 / Gap B. `[ship]` appears somewhere in the branch's commits
            # but never on a line of its own, so the exact-line test above found
            # nothing and the PR would otherwise sit silently unmerged forever.
            # This is the most common way the marker fails -- appending it to a
            # descriptive subject line is the natural move and it never works.
            # Say so out loud instead of logging a notice nobody reads.
            #
            # A docs commit that merely *discusses* `[ship]` trips this too. That
            # is a known, accepted false positive: the outcome is one advisory
            # comment and never a block, so the wording stays conditional and
            # must not accuse.
            echo "::warning::#$number has a [ship] substring but no own-line marker; not self-merging."

            # Every push re-runs this workflow, so say it once per PR.
            if gh_retry gh pr view "$number" --json comments \
                 --jq '.comments[].body' | grep -qF 'SHIP_MALFORMED'; then
              echo "::notice::already explained on #$number; not commenting again."
              exit 0
            fi

            printf '%s\n' \
              '<!-- SHIP_MALFORMED -->' \
              'This branch mentions `[ship]`, but not on a line of its own — so the' \
              'auto-merge check did not match and this PR will **not** self-merge.' \
              '' \
              'The only accepted form is a line whose entire content is the marker:' \
              '' \
              '```' \
              '[ship]' \
              '```' \
              '' \
              '`[ship]` appended to a subject line, or inside a sentence, is ignored by' \
              'design — that test exists so a commit merely *discussing* shipping cannot' \
              'arm a merge.' \
              '' \
              'If you meant to tag this PR, add the marker as its own commit:' \
              '' \
              '```bash' \
              "git commit --allow-empty -m '[ship]' && git push" \
              '```' \
              '' \
              'If you were only writing about the marker, ignore this — nothing is' \
              'blocked, and this comment is posted once per PR.' > /tmp/ship-malformed.md
            # Best-effort: losing this comment doesn't change any outcome, it is
            # only the explanation, so it stays retried-but-non-fatal.
            gh_retry gh pr comment "$number" --body-file /tmp/ship-malformed.md || true
          else
            echo "::notice::no [ship] marker on any commit in #$number; leaving it for review."
          fi
