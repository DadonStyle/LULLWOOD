name: CI

# The branch-push trigger is the load-bearing one, and it is new here.
#
# Pull requests opened by GITHUB_TOKEN (see auto-pr.yml) do not start
# `pull_request` workflow runs — GitHub suppresses them so workflows cannot
# recurse. A PR whose checks never start can never satisfy the required status
# checks on `main`, so for agent-opened PRs, CI has to attach to the branch push
# instead. Branch protection resolves required checks against the head SHA no
# matter which event produced them, so the ruleset is satisfied either way.
#
# `pull_request` stays for two reasons: it is the fallback if Actions is ever
# not permitted to open PRs (a human-opened PR still gets its checks), and
# dropping it would deadlock this very change — the PR introducing it would be
# evaluated against its own workflow file and never run a check at all.
#
# LUL-100: for any branch that lives in THIS repo, the push trigger above
# already covers it, so the pull_request trigger is pure duplication — same
# head SHA, two full runs (including two Playwright suites), racing each
# other under different concurrency groups (`refs/heads/<branch>` vs
# `refs/pull/N/merge`) that never cancel each other. When the runner is slow,
# both runs draw against the same wall-clock-sensitive assertions
# (scent.spec.ts:63, smoke.spec.ts:132) and doubling the draws doubles the
# odds one instance comes back red — and one red instance on the head SHA is
# enough to hold `mergeable_state: blocked`, even though the *other* instance
# (the more meaningful one, base-merged) is green. See wiki
# systems/ci-double-run.
#
# A same-SHA concurrency group with cancel-in-progress does not fix this: a
# required check that gets cancelled reports conclusion `cancelled`, which
# GitHub does not treat as passing, so the cancelled duplicate would still
# block the merge it was meant to stop blocking. So this is a scope filter,
# not a race — `pull_request` runs only when the PR's head repo differs from
# this one, i.e. only for an external fork, which is the one case the push
# trigger structurally cannot cover (a fork's push never reaches Actions on
# this repo). Every `lul-*` branch and every same-repo human-opened PR is
# push-covered and gets exactly one run.
#
# LUL-479: a job-level `if:` only decides whether a job's STEPS run — GitHub
# still records a check-run under the job's `name:` with conclusion `skipped`
# for the same-repo `pull_request` run that self-skips below. That skipped
# check-run shares its name with the required context, and GitHub's ruleset
# treats a `skipped` conclusion as satisfying a required status check — it
# is not "latest wins", it is "skipped counts as pass", independent of a
# later `failure` conclusion landing under the same name from the real run
# (confirmed live: PR #78, head 526a0ab0, `mergeable_state: clean` while
# `playwright smoke suite` read `failure` — see wiki systems/ci-double-run).
# So `if:` alone cannot make this safe; the self-skip copy must never carry
# the required-context name at all. Each job's `name:` below is therefore
# conditional: only the genuinely-skipped same-repo `pull_request` run gets a
# renamed, non-required check-run name. Push, workflow_dispatch, and a real
# fork `pull_request` run all still produce the exact required-context name.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same PR/branch. Keyed on event name + head SHA
# so that a `pull_request` run (which is skipped for same-repo branches via
# the `if:` guards below) does not share a concurrency group with the `push`
# run and therefore cannot cancel it via cancel-in-progress.
# Without the event name prefix, the pull_request run would cancel the push
# run and then immediately be skipped itself, leaving no CI run for the commit.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  unit:
    # LUL-479: renamed on the same-repo `pull_request` self-skip path so its
    # `skipped` check-run never shares the required context's name — see the
    # comment above `on:`.
    name: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && 'unit tests (self-skip, not a required-check instance)' || 'unit tests' }}
    runs-on: ubuntu-latest
    # Same fork-scope guard as `build` — see the LUL-100 comment above `on:`.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # LUL-445: cheap guard against a credential embedded in a remote URL
      # (LUL-221/LUL-238/LUL-438 all leaked the same PAT this way). No
      # node_modules needed, so this runs before `npm ci`.
      - name: git remote credential guard
        run: node scripts/check-git-remote-credentials.mjs --repo .

      - run: npm ci

      - name: unit tests
        run: npm test

  build:
    # LUL-479: see the comment on the `unit` job's `name:` above — same idea.
    name: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && 'build, typecheck, lint (self-skip, not a required-check instance)' || 'build, typecheck, lint' }}
    runs-on: ubuntu-latest
    # See the LUL-100 comment above `on:` — same-repo branches are already
    # covered by the push trigger; only a fork PR needs this event.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `next lint` was removed in Next.js 16; eslint runs directly (see package.json).
      - name: lint
        run: npm run lint

      # Next 16 injects globals like LayoutProps from generated route types, and
      # next-env.d.ts is gitignored. Neither exists in a fresh checkout, so tsc
      # must not run until typegen has written them.
      - name: typegen
        run: npx next typegen

      - name: typecheck
        run: npx tsc --noEmit

      - name: build
        run: npx next build

  smoke:
    # LUL-479: see the comment on the `unit` job's `name:` above — same idea.
    # `needs: build` below refers to the job id, not this display name, so
    # renaming here does not affect that reference.
    name: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && 'playwright smoke suite (self-skip, not a required-check instance)' || 'playwright smoke suite' }}
    needs: build
    runs-on: ubuntu-latest
    # A job-level `if:` replaces the implicit `needs: success()` gate rather
    # than adding to it (LUL-106), so the fork-scope condition alone would let
    # this run even when `build` genuinely fails. `needs.build.result` restores
    # that gate explicitly.
    if: needs.build.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # GitHub runners have root, so real system deps get installed here
      # instead of the user-prefix workaround playwright.config.ts falls back
      # to locally (see wiki:systems/headless-qa-rig). `CI` is set by GitHub
      # Actions automatically, which is what that fallback checks against.
      - name: install playwright browsers + system deps
        run: npx playwright install --with-deps chromium

      - name: playwright smoke suite
        run: npx playwright test

      # reporter is 'list' (playwright.config.ts), so playwright-report/ is
      # never produced. On failure, Playwright's own output -- screenshots,
      # traces, error-context.md -- lands in test-results/ instead; that's
      # what needs uploading. `always()` (not `failure()`) so this still runs
      # after a cancellation, and if-no-files-found stays quiet on green runs.
      - name: upload playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
