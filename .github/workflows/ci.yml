name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build, typecheck, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `next lint` was removed in Next.js 16; eslint runs directly (see package.json).
      - name: lint
        run: npm run lint

      - name: typecheck
        run: npx tsc --noEmit

      - name: build
        run: npx next build

  smoke:
    name: playwright smoke suite
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # GitHub runners have root, so real system deps get installed here
      # instead of the user-prefix workaround playwright.config.ts falls back
      # to locally (see wiki:systems/headless-qa-rig). `CI` is set by GitHub
      # Actions automatically, which is what that fallback checks against.
      - name: install playwright browsers + system deps
        run: npx playwright install --with-deps chromium

      - name: playwright smoke suite
        run: npx playwright test

      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
