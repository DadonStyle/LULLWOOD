name: CI

# Triggers: `push` + `workflow_dispatch` only. No `pull_request` trigger.
#
# History: this workflow used to also trigger on `pull_request`, scoped by a
# per-job `if:` to skip same-repo branches (LUL-100), since the `push`
# trigger already covers every branch that lives in this repo -- a same-repo
# `pull_request` run was pure duplication of the push run on the identical
# head SHA.
#
# LUL-508 found why that skip was broken: GitHub does not evaluate
# `jobs.<id>.name` for a job skipped by its `if:` -- it serves the raw,
# unevaluated `${{ }}` template text as the check-run name instead (measured
# with a throwaway 2x2 trigger x skip-status workflow, not inferred -- see
# wiki systems/ci-jobname-expr-literal). A same-repo `pull_request` run here
# is *always* skipped, so its check-run name was either the plain
# required-context string (colliding with the real push-run instance --
# LUL-479's P0 gate hole) or the garbled literal expression PR #83 shipped
# to dodge that collision. Neither is right: a single static `name:` cannot
# be both distinct-when-skipped (same-repo, the common case) and
# identical-to-the-required-context-when-it-runs (a genuine fork PR, which
# this repo has never received) at the same time. Splitting `pull_request`
# into its own workflow file doesn't resolve that tension either -- to cover
# a real fork PR automatically that file's job names would have to equal the
# required-context strings, which reintroduces the exact same-repo collision
# this change removes; giving it different names instead means it could
# never have satisfied a fork PR's required checks anyway, so it would only
# be a second file to maintain for a status check nothing requires. Simplest
# is dropping the trigger outright, so there's no self-skip run and no name
# to get wrong.
#
# Direct consequence, decided deliberately rather than left implicit: fork
# PRs lose automatic required-check coverage. This repo's `push` trigger
# cannot see a fork's commits, and there is no longer a `pull_request` run to
# cover them either. The documented path for the day a fork PR arrives is a
# manual `workflow_dispatch` against its head ref, run by whoever is landing
# it -- the same mechanism pr-freshness.yml already relies on to get CI onto
# GITHUB_TOKEN-authored backmerge commits (see that file's LUL-439 comment).
#
# pr-freshness.yml's "approve parked action_required runs" step (LUL-463) was
# working around action_required parks on the same-repo `pull_request` run
# this trigger used to produce. With the trigger gone, that step now matches
# zero runs -- inert, not broken. Left in place to keep this diff scoped to
# the naming fix; safe to delete in a follow-up.
on:
  push:
    branches: ['**']
  workflow_dispatch:

# Cancel superseded runs on the same head SHA. `push` (and an occasional
# manual `workflow_dispatch`) are the only events that reach this workflow
# now, so there is no push-vs-pull_request race to key around (the
# event-name prefix this group used to carry existed only for that --
# see systems/ci-double-run's LUL-107/109 section for the race it guarded
# against).
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    # LUL-485: no explicit timeout meant a hang inherited GitHub's 360-minute
    # default and pinned a runner for hours instead of failing fast. Observed
    # duration across 12 green runs on 2026-08-19: 15-24s, so 10 min is ~25x
    # headroom, not a tight guess.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # LUL-445: cheap guard against a credential embedded in a remote URL
      # (LUL-221/LUL-238/LUL-438 all leaked the same PAT this way). No
      # node_modules needed, so this runs before `npm ci`.
      - name: git remote credential guard
        run: node scripts/check-git-remote-credentials.mjs --repo .

      - run: npm ci

      - name: unit tests
        run: npm test

  build:
    name: build, typecheck, lint
    runs-on: ubuntu-latest
    # LUL-485: same rationale as `unit` above. Observed 26-40s across the same
    # 12 green runs; 10 min is ~15x headroom.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `next lint` was removed in Next.js 16; eslint runs directly (see package.json).
      - name: lint
        run: npm run lint

      # Next 16 injects globals like LayoutProps from generated route types, and
      # next-env.d.ts is gitignored. Neither exists in a fresh checkout, so tsc
      # must not run until typegen has written them.
      - name: typegen
        run: npx next typegen

      - name: typecheck
        run: npx tsc --noEmit

      - name: build
        run: npx next build

  smoke:
    name: playwright smoke suite
    needs: build
    runs-on: ubuntu-latest
    # LUL-485: this is the job that actually hangs. `playwright install
    # --with-deps` shells out to `apt-get update`, and apt sets no read
    # timeout, so a stalled mirror connection blocks forever (see
    # wiki:systems/ci-job-timeout-apt-hang). 30 min, not 20: observed green
    # runs were 12-19 min, so 20 would leave ~1 min of margin over a
    # legitimately slow run. 30 keeps ~1.6x headroom.
    #
    # `concurrency: cancel-in-progress` does not reclaim these -- it only
    # fires when a newer run in the same group arrives, and this group is
    # keyed on the head SHA, so a wedged run on a head nobody pushes again
    # has no successor to evict it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # GitHub runners have root, so real system deps get installed here
      # instead of the user-prefix workaround playwright.config.ts falls back
      # to locally (see wiki:systems/headless-qa-rig). `CI` is set by GitHub
      # Actions automatically, which is what that fallback checks against.
      - name: install playwright browsers + system deps
        run: npx playwright install --with-deps chromium

      - name: playwright smoke suite
        run: npx playwright test

      # reporter is 'list' (playwright.config.ts), so playwright-report/ is
      # never produced. On failure, Playwright's own output -- screenshots,
      # traces, error-context.md -- lands in test-results/ instead; that's
      # what needs uploading. `always()` (not `failure()`) so this still runs
      # after a cancellation, and if-no-files-found stays quiet on green runs.
      - name: upload playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
