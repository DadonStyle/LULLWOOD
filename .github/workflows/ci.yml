name: CI

# push + workflow_dispatch only. NO `pull_request` trigger -- this is
# deliberate, not an oversight, and it must not be re-added without reading
# LUL-729 and LUL-719 in the wiki (systems/ci-double-run) first.
#
# Pull requests opened by GITHUB_TOKEN (see auto-pr.yml) do not start
# `pull_request` workflow runs — GitHub suppresses them so workflows cannot
# recurse. A PR whose checks never start can never satisfy the required status
# checks on `release/next`/`main`, so for agent-opened PRs, CI has to attach to
# the branch push instead.
#
# CORRECTED 2026-08-26 (LUL-762): the claim that used to sit here --
# "branch protection resolves required checks against the head SHA no matter
# which event produced them, so the ruleset is satisfied either way" -- is
# FALSE for `workflow_dispatch`, measured live on PR #148/#149/#150. A
# `workflow_dispatch` run's check-runs attach to the commit (they show up on
# `GET /commits/{sha}/check-runs`, name-matched, app-matched, `success`) but
# they never enter the PULL REQUEST's `statusCheckRollup` -- which is what
# `PUT /pulls/{n}/merge` actually evaluates. A PR whose only CI run on its head
# is `workflow_dispatch` reads "3 of 3 required status checks are expected"
# forever, no matter how green the commit looks from the REST check-runs
# endpoint. Only a real `push` (or a same-repo `pull_request`, which we don't
# trigger on, see below) enters the rollup. See wiki
# playbooks/ci-green-from-workflow-dispatch and systems/ci-github-token-blind-spot
# for the full history of why `workflow_dispatch` was ever treated as
# equivalent -- it was never actually verified against the rollup until now.
#
# Practical effect: `push` is the ONLY event that can satisfy a required
# check for merge purposes on this repo. Every `lul-*` branch pushed by a real
# credential (deploy key or PAT) is push-covered and gets exactly one
# satisfying run. A branch whose head is a GITHUB_TOKEN-authored commit (e.g.
# `update-branch`'s merge commit, run by hand or by a GitHub Actions job) is
# NOT covered by anything in this file -- `workflow_dispatch` was believed to
# be the rescue and is not. This blind spot was also this repo's own routine
# case until LUL-778 (2026-08-27) deleted the automatic backmerge step that
# used to live in `pr-freshness.yml` (now `approve-parked-runs.yml`) for
# exactly this reason -- see that file's header for the full history and
# wiki systems/ci-github-token-blind-spot.
#
# LUL-719/LUL-729 (2026-08-26): `pull_request` used to stay as a fork-PR
# fallback, gated by a job-level `if: ... head.repo.full_name != ...` so the
# same-repo case would just "skip". That was proven unsafe, not merely
# wasteful: LUL-719 measured live on PR #137 (head `b07aa589`) that branch
# protection resolves a required check by its LATEST instance and treats
# `skipped` as passing. `approve-parked-runs.yml`'s (formerly
# `pr-freshness.yml`, LUL-778) "approve parked action_required
# runs" step (LUL-463) unparks the bot-authored `pull_request` run some time
# after the real push/workflow_dispatch run already posted a `success` — so a
# later `skipped` instance can land on top of an EARLIER real instance under
# the identical required-check name, with no ordering guarantee. On #137 the
# earlier instance happened to be a genuine success, so nothing broke, but
# the same mechanism would just as easily let a later skip paper over an
# earlier real `failure`. That is a required-status-check bypass, not a
# flake, and job-level `if:` cannot fix it: GitHub still publishes a
# `skipped` check-run under the job's static name even when the job body
# never executes (see also systems/ci-jobname-expr-literal -- a conditional
# `name:` doesn't evaluate for a skipped job either, so renaming the
# collision away isn't an option). The only structural fix is to never let a
# same-repo `pull_request` event produce a check-run under a required name at
# all, which means not triggering on `pull_request` in the first place.
#
# Named, deliberate consequence (same one LUL-508 already accepted once):
# a genuine fork PR loses automatic required-check coverage, since `push`
# can't see a fork's commits. A manual `workflow_dispatch` against the fork's
# head ref gets a green check-run on the commit, but per the LUL-762
# correction above that green does NOT enter the PR's rollup and does NOT
# satisfy the ruleset -- a fork PR (or any GITHUB_TOKEN-authored head) needs
# an actual push from a real credential to become mergeable, full stop.
# Zero fork PRs received in this repo's history as of this writing.
on:
  push:
    branches: ['**']
  workflow_dispatch:

# Cancel superseded runs on the same branch (e.g. two pushes in quick
# succession). LUL-894: the key used to be event name + head SHA, which
# cannot do this -- two pushes in quick succession have different SHAs, so
# they land in different concurrency groups and neither cancels the other.
# A per-SHA group only dedupes a re-dispatch of the identical commit.
# Measured live: 42/100 runs superseded while still running, only 3
# `cancelled`, ~24% of all CI wall-time burned on dead commits (wiki
# systems/ci-concurrency-key-outlived-premise). Keyed on `github.ref` instead
# -- this correctly collapses successive pushes to the same branch. The SHA
# half of the old key existed only to collapse a same-commit `push` run
# against a same-commit `pull_request` run (LUL-100/PR#12); LUL-719/LUL-729
# (2026-08-26) deleted the `pull_request` trigger above, so that collision
# can no longer happen and SHA buys nothing. `github.event_name` stays in the
# key so a manual `workflow_dispatch` still never races a concurrent push to
# the same ref (LUL-107). This is the same shape auto-pr.yml already uses
# (`auto-pr-${{ github.ref }}`).
#
# A superseded run cannot cost a required check: branch protection resolves
# required checks by name against the head SHA, and a superseded run is by
# definition on a non-head SHA -- its check-runs were never consulted for the
# PR's rollup. `github.ref` still separates branches and `github.event_name`
# still separates push from dispatch, so nothing can collide on one SHA that
# couldn't before (the LUL-719 hazard is unrelated and untouched by this).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    # LUL-485: no explicit timeout meant a hang inherited GitHub's 360-minute
    # default and pinned a runner for hours instead of failing fast. Observed
    # duration across 12 green runs on 2026-08-19: 15-24s, so 10 min is ~25x
    # headroom, not a tight guess.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # LUL-445: cheap guard against a credential embedded in a remote URL
      # (LUL-221/LUL-238/LUL-438 all leaked the same PAT this way). No
      # node_modules needed, so this runs before `npm ci`.
      - name: git remote credential guard
        run: node scripts/check-git-remote-credentials.mjs --repo .

      # LUL-588: docs/ELEMENTS.md cites engine line numbers that go stale on
      # every engine edit; they had been re-derived by hand three times and
      # were measured wrong 82/82 on release/next @ af0c995. This fails the
      # build on any citation that drifts off its anchor symbol and is not
      # already listed in scripts/elements-citations-baseline.json. No
      # `|| true` and no ::warning:: downgrade -- a NEW drifted citation is a
      # hard failure, and the baseline may shrink but never grow. Needs no
      # node_modules, so it runs before `npm ci` like the guard above.
      - name: ELEMENTS.md citation guard
        run: node scripts/check-elements-citations.mjs

      # LUL-641 (LUL-277 wave 7, final): effectiveDetect()/canSee()/
      # STILL_RAMP/STILL_DETECT_CUT existed twice -- once in lib/game/cover.ts
      # (tested) and once, independently, in engine/forest-engine.js
      # (shipped) -- and nine green tests were exercising the copy the game
      # never ran. Fails when an identifier is declared at engine top level
      # AND exported by a lib/game/*.ts module AND not imported by the
      # engine (aliased imports still count), unless it's in the dated
      # ALLOWLIST at the top of the script. No node_modules needed, so this
      # runs before `npm ci` like the two guards above.
      - name: duplicate-logic guard
        run: node scripts/check-duplicate-logic.mjs

      - run: npm ci

      - name: unit tests
        run: npm test

  build:
    name: build, typecheck, lint
    runs-on: ubuntu-latest
    # LUL-485: see the `unit` job's comment. Observed duration across 12 green
    # runs on 2026-08-19: 26-40s, so 10 min is ~15x headroom.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `next lint` was removed in Next.js 16; eslint runs directly (see package.json).
      - name: lint
        run: npm run lint

      # Next 16 injects globals like LayoutProps from generated route types, and
      # next-env.d.ts is gitignored. Neither exists in a fresh checkout, so tsc
      # must not run until typegen has written them.
      - name: typegen
        run: npx next typegen

      - name: typecheck
        run: npx tsc --noEmit

      - name: build
        run: npx next build

  smoke:
    name: playwright smoke suite
    needs: build
    runs-on: ubuntu-latest
    # LUL-485: without this, a hung job inherited GitHub's 360-minute default
    # and pinned a runner for hours (measured: two `workflow_dispatch` runs on
    # superseded heads sat `in_progress` for 4h47m and 3h57m before being
    # cancelled by hand). Root cause of both hangs, from job logs: `npx
    # playwright install --with-deps chromium`'s internal `apt-get update`
    # stalled fetching `noble-security InRelease` from archive.ubuntu.com —
    # apt sets no read timeout, so a stalled TCP connection to a mirror hangs
    # forever instead of erroring. That is a runner/network flake outside
    # this repo's control; the cap here turns it into a bounded, visible
    # failure instead of eliminating it.
    #
    # 30 min, not the 20 guessed when this was filed: 12 green runs on
    # 2026-08-19 ranged 723-1138s (12-19min), so 20min would leave as little
    # as ~1min of margin over the slowest legitimate run and risk flaking
    # real passes. 30min keeps ~1.6x headroom over the observed max.
    timeout-minutes: 30
    # A job-level `if:` replaces the implicit `needs: success()` gate rather
    # than adding to it (LUL-106) -- `needs.build.result` restores that gate
    # explicitly. (No fork-scope half here anymore: `pull_request` is gone
    # from `on:` above, see that block's comment.)
    if: needs.build.result == 'success'
    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # GitHub runners have root, so real system deps get installed here
      # instead of the user-prefix workaround playwright.config.ts falls back
      # to locally (see wiki:systems/headless-qa-rig). `CI` is set by GitHub
      # Actions automatically, which is what that fallback checks against.
      - name: install playwright browsers + system deps
        run: npx playwright install --with-deps chromium

      - name: playwright smoke suite
        run: npx playwright test

      # reporter is 'list' (playwright.config.ts), so playwright-report/ is
      # never produced. On failure, Playwright's own output -- screenshots,
      # traces, error-context.md -- lands in test-results/ instead; that's
      # what needs uploading. `always()` (not `failure()`) so this still runs
      # after a cancellation, and if-no-files-found stays quiet on green runs.
      - name: upload playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
