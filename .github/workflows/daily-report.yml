name: Daily report

# Generates DAILY_REPORTS/ entries for the last 2 days and lands the diff.
# Spec: wiki systems/daily-reports §9.
#
# Why the full cycle lives in this one job (LUL-534):
# A push made with GITHUB_TOKEN does not trigger other workflows (GitHub's
# recursion guard). auto-pr.yml fires on push only, and automerge.yml fires
# only when CI's triggering event is "push" -- both are silent on
# GITHUB_TOKEN-authored pushes. This workflow therefore handles everything:
#   1. generate → commit → push branch
#   2. open PR
#   3. wait for CI, then submit an approving review and merge
#
# CORRECTED 2026-08-29 (LUL-960/969, "5 consecutive red runs" recurrence):
# the "commit and push" step used to push with `github.token`, and a separate
# "dispatch CI" step used `workflow_dispatch` to work around the resulting
# missing push-triggered run. That "fix" never worked: a `workflow_dispatch`
# check-run attaches to the commit but never enters the PULL REQUEST's
# `statusCheckRollup`, which is what `PUT /pulls/{n}/merge` actually reads --
# so the merge step always refused with "Required status check 'unit tests'
# is expected", every single night, even though CI itself was green (measured
# live, wiki systems/ci-github-token-blind-spot §RECURRENCE 2026-08-29). The
# push now uses `SHIP_REVIEW_PAT` (already provisioned as a repo secret for
# the approval step below -- no new secret needed), which is a real user PAT
# and is not subject to the GITHUB_TOKEN recursion guard, so `ci.yml`'s `push`
# trigger fires natively and its check-runs enter the rollup for real. The
# `dispatch CI` step is gone -- it was dead weight even when it ran.
#
# The approving review below must be submitted under a different identity than
# the PR author, or GitHub 422s with "Review Can not approve your own pull
# request" (systems/github-access "Self-approval") -- this PR is opened under
# `github.token` (`github-actions[bot]`), same as every other self-serve PR in
# this repo, so the review step cannot reuse `github.token` either. It uses
# the `SHIP_REVIEW_PAT` repo secret instead, exactly like automerge.yml
# (LUL-558) -- see systems/ship-never-merges-review-count-gap. `bot-approve.yml`
# cannot substitute here (unlike automerge.yml's LUL-912 fix): that workflow
# also runs as `github-actions[bot]`, so it would be approving its own PR and
# 422 the same way `github.token` does. There is no identity in this repo
# other than `SHIP_REVIEW_PAT` that can approve a bot-authored PR (LUL-960).
#
# Failure modes:
#   - No diff → exits 0, nothing committed (expected when nothing landed).
#   - CI red/timeout, review-submit failure, or merge refused → exits 1; PR
#     stays open with the problem visible in the run log, pending next night.
#   - SHIP_REVIEW_PAT not configured → exits 0 (LUL-960). This is a known,
#     standing condition, not a bug in this run, so it must not paint the
#     schedule red every single night for the same unconfigured secret. The
#     step posts a comment on the PR instead, naming exactly what's missing,
#     so the PR is discoverable by anyone browsing open PRs rather than only
#     by whoever reads that night's Actions log.
#   The following night's run uses --since 2 days ago, so a missed day is
#   always corrected on the next successful run.
#
# The "commit and push" step also stopped deleting an OPEN PR's branch ref on
# every run. That delete-then-recreate was written to give same-day retries a
# clean fast-forward, but deleting an open PR's branch auto-closes the PR --
# which is exactly why 5 failed nights in a row went unnoticed (each retry
# silently closed the previous attempt's PR). It now only deletes the ref when
# there is no open PR pointing at it; otherwise it reuses that PR, since
# report content is idempotent (wiki systems/daily-reports §7) and there is
# nothing new to add on top of it.

on:
  schedule:
    # 21:10 UTC = 00:10 Asia/Jerusalem -- ten minutes after the reported day ends
    - cron: '10 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  # One run at a time. A schedule tick that fires while the previous night's
  # run is still waiting on CI cancels it rather than stacking open PRs.
  group: daily-report
  cancel-in-progress: true

jobs:
  generate-and-land:
    name: generate reports and land PR
    runs-on: ubuntu-latest
    if: github.repository == 'DadonStyle/LULLWOOD'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Persist SHIP_REVIEW_PAT as the credential for any later plain
          # `git push` in this job (the "commit and push" step below), instead
          # of the default GITHUB_TOKEN. GitHub does not fire the `push`
          # workflow trigger for GITHUB_TOKEN-authored commits, which is the
          # root cause fixed in this PR -- see the header comment. Falls back
          # to github.token when the secret isn't configured, matching the
          # existing fallback in the "wait for CI, approve, and merge" step;
          # LUL-960 already covers what happens then (push proceeds but won't
          # self-trigger CI, and the PR is left for manual review).
          token: ${{ secrets.SHIP_REVIEW_PAT || github.token }}
          # LUL-925: branch from (and target) `release/next`, not `main`. The
          # release train only lets `release/next` reach `main`, and
          # `.github/scripts/base-branch-guard.sh` enforces it: a PR whose base
          # is `main` and whose head is not `release/next` FAILS the required
          # "base branch guard" check unless it carries `emergency-hotfix`.
          # This workflow opened its PR with `--base main`, so every nightly
          # report PR was structurally unmergeable -- it opened, went red on
          # the guard, and sat there (PR #206, run 33156610173). Reports reach
          # `main` the way everything else does: the version cut.
          ref: release/next

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install dependencies
        run: npm ci

      # Compute the 2-day window in Asia/Jerusalem. Python gives reliable TZ
      # arithmetic without shell tricks that differ across runner images.
      - name: compute date range
        id: dates
        run: |
          python3 - <<'EOF'
          import os
          from datetime import datetime, timedelta
          import zoneinfo

          tz = zoneinfo.ZoneInfo("Asia/Jerusalem")
          now = datetime.now(tz)
          yesterday   = (now - timedelta(days=1)).strftime('%Y-%m-%d')
          day_before  = (now - timedelta(days=2)).strftime('%Y-%m-%d')
          branch      = f'lul-534-daily-{yesterday}'

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'since={day_before}\n')
              f.write(f'until={yesterday}\n')
              f.write(f'branch={branch}\n')
          EOF

      - name: generate reports
        run: |
          node scripts/daily-report.mjs \
            --since=${{ steps.dates.outputs.since }} \
            --until=${{ steps.dates.outputs.until }}

      - name: check for changes
        id: diff
        run: |
          # `git diff` only sees changes to already-tracked files. The
          # generator's whole job is writing DAILY_REPORTS/<new-day>.md,
          # which is untracked on first write, so `git diff --quiet HEAD --`
          # reports "nothing changed" even when two brand-new report files
          # just landed on disk (found live 2026-08-26, LUL-534). `git
          # status --porcelain` covers untracked and modified paths alike.
          if [ -z "$(git status --porcelain -- DAILY_REPORTS/)" ]; then
            echo "empty=true"  >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: commit and push
        if: steps.diff.outputs.empty == 'false'
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.dates.outputs.branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add DAILY_REPORTS/
          git commit -m "LUL-534: daily reports ${{ steps.dates.outputs.until }}

          Auto-generated by the nightly daily-report workflow.
          Changed files: DAILY_REPORTS/*.md only — qualifies for [ship].

          [ship]"

          # A branch from a previous run tonight may still be here. Only drop
          # its ref when there is no OPEN PR pointing at it -- deleting an
          # open PR's branch ref auto-closes the PR, which is what hid 5
          # straight failed nights behind silently-closed PRs instead of one
          # visible open one. Report content is idempotent (wiki
          # systems/daily-reports §7), so a same-day rerun has nothing new to
          # add on top of an already-open PR -- reuse it instead of replacing it.
          existing_pr="$(gh pr list --head "$BRANCH" --state open \
                           --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            sha="$(gh pr view "$existing_pr" --json headRefOid --jq .headRefOid)"
            echo "::notice::PR #$existing_pr already open for $BRANCH from earlier tonight; reusing it, nothing new to push"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          else
            gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" 2>/dev/null || true

            # Real credential (see the checkout step's `token:`), not
            # github.token -- this is the push that must fire ci.yml's `push`
            # trigger for the merge gate below to ever see a satisfying run.
            git push origin "HEAD:refs/heads/$BRANCH"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: open PR
        if: steps.diff.outputs.empty == 'false'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.dates.outputs.branch }}
          UNTIL: ${{ steps.dates.outputs.until }}
        run: |
          set -euo pipefail

          # Idempotent: if a PR already opened (e.g. this step reruns), reuse it.
          existing="$(gh pr list --head "$BRANCH" --state open \
                        --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "number=$existing" >> "$GITHUB_OUTPUT"
            echo "::notice::PR #$existing already exists for $BRANCH"
            exit 0
          fi

          # `gh pr create` does NOT accept --json/--jq -- unlike `gh pr list`
          # just above, which does. It prints the new PR's URL on stdout, so
          # the number is the last path segment. Passing --json here made this
          # step die with "unknown flag: --json" on the very first run that
          # ever reached it (LUL-534, run 33032851122): until the untracked-file
          # fix landed, step 7 always reported "empty" and steps 8-11 skipped,
          # so this line had never once executed.
          url="$(gh pr create \
            --base release/next \
            --head "$BRANCH" \
            --title "LUL-534: daily reports $UNTIL" \
            --body "Auto-generated by the nightly daily-report workflow (LUL-534).

          Changes: \`DAILY_REPORTS/*.md\` only — qualifies for \`[ship]\`.
          See \`.github/scripts/ship-allowed.sh\`.

          **Mobile:** docs-only, no gameplay or UI changes.")"

          number="${url##*/}"

          # Fail closed: an empty or non-numeric parse would otherwise be handed
          # to the merge step, which would approve and merge the wrong PR.
          case "$number" in
            ''|*[!0-9]*)
              echo "::error::could not parse a PR number from gh pr create output: '$url'"
              exit 1
              ;;
          esac

          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "::notice::opened PR #$number for $BRANCH"

      - name: wait for CI, approve, and merge
        if: steps.diff.outputs.empty == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SHIP_REVIEW_TOKEN: ${{ secrets.SHIP_REVIEW_PAT }}
          SHA: ${{ steps.push.outputs.sha }}
          BRANCH: ${{ steps.dates.outputs.branch }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # ── locate the CI run ────────────────────────────────────────────────
          # Find the `push`-triggered run on the exact commit the previous
          # step pushed (or reused). A push made with a real credential fires
          # ci.yml's `push` trigger natively -- this is the only event whose
          # check-runs enter the PR's required-check rollup on this repo
          # (wiki systems/ci-github-token-blind-spot); `workflow_dispatch`
          # never did, no matter how green it looked. `head_sha` needs the
          # full 40-char sha or the API silently returns nothing.
          echo "::notice::waiting for CI push run on $SHA..."
          run_id=""
          for i in $(seq 1 18); do
            sleep 10
            run_id="$(gh api \
              "repos/$REPO/actions/runs?head_sha=$SHA&event=push&per_page=10" \
              --jq '.workflow_runs[] | select(.name == "CI") | .id' \
              | head -1)"
            [ -n "$run_id" ] && break
          done

          if [ -z "$run_id" ]; then
            echo "::error::timed out waiting for a push-triggered CI run on $SHA; PR #$PR_NUMBER stays open"
            exit 1
          fi
          echo "::notice::tracking CI run $run_id"

          # ── wait for completion (up to 50 min, poll every 30 s) ─────────────
          # LUL-534: this budget was 25 min (50 × 30 s) and was structurally too
          # short -- it could never succeed, on any run. CI's "playwright smoke
          # suite" job alone takes ~26 min (measured over three consecutive
          # green runs: 33156322203 = 25.8, 33156660086 = 26.2, 33157020332 =
          # 25.8), and the whole CI run wall-clock is ~27 min. Run 33156610173
          # gave up at 09:11:45 on a CI run that went green at 09:13:33 -- 108
          # seconds early -- and reported "did not complete within the time
          # limit", which reads exactly like a hung or broken CI rather than a
          # wait that was simply too impatient. Budget 50 min so a slower-than-
          # usual suite still lands; the job has no timeout-minutes, so the
          # 360 min GitHub default is the real ceiling and this stays well under
          # it. Raise this if the playwright suite's runtime grows again.
          status=""; conclusion=""
          for i in $(seq 1 100); do
            sleep 30
            result="$(gh api "repos/$REPO/actions/runs/$run_id" \
                        --jq '[.status, (.conclusion // "")] | join(":")')"
            status="${result%%:*}"
            conclusion="${result##*:}"
            echo "::notice::run $run_id: $status/$conclusion"
            [ "$status" = "completed" ] && break
          done

          if [ "$status" != "completed" ]; then
            echo "::error::CI run $run_id did not complete within the time limit"
            exit 1
          fi

          if [ "$conclusion" != "success" ]; then
            echo "::error::CI run $run_id concluded $conclusion -- PR #$PR_NUMBER stays open"
            exit 1
          fi

          # ── submit approving review ──────────────────────────────────────────
          # Required because the main ruleset enforces required_approving_review_count=1
          # with no bypass actor. This PR is authored by github-actions[bot] under
          # github.token, so github.token approving it 422s unconditionally
          # ("Review Can not approve your own pull request") -- there is no repo
          # setting that lifts GitHub's same-identity rule, and bot-approve.yml
          # can't stand in either -- it is the same identity as the PR author
          # here (see the header comment). Must run under SHIP_REVIEW_TOKEN (the
          # studio PAT), never GH_TOKEN.
          #
          # LUL-960: an unconfigured secret is a known, standing condition (it
          # has never been configured on this repo), not a per-run anomaly --
          # `exit 1` here used to red the schedule every night for the same
          # unactionable reason, and that red is easy to stop reading (LUL-912
          # documented the same silent-refusal shape on automerge.yml). Leave
          # the PR open and go green, but say exactly why on the PR itself so
          # it's found by anyone browsing open PRs, not only by whoever reads
          # that night's Actions log.
          if [ -z "${SHIP_REVIEW_TOKEN:-}" ]; then
            echo "::warning::SHIP_REVIEW_PAT secret is not configured; PR #$PR_NUMBER needs a manual approving review and merge."
            body="Auto-merge did not run: the \`SHIP_REVIEW_PAT\` repo secret is not configured, so there is no identity available to submit the required approving review on this bot-authored PR (\`github.token\` and \`bot-approve.yml\` both 422 on self-approval here — see LUL-960)."
            body="$body"$'\n\n'"CI is green on \`$BRANCH\`. Diff is \`DAILY_REPORTS/*.md\` only."
            body="$body"$'\n\n'"**This PR needs a human or the Code Reviewer to approve and merge it manually.** Tomorrow night's run covers a rolling 2-day window, so a missed merge isn't lost — but letting these stack up wastes the CI run each one already paid for."
            gh pr comment "$PR_NUMBER" --body "$body"
            echo "::notice::daily-report run complete: PR #$PR_NUMBER opened, CI green, left open pending manual review (SHIP_REVIEW_PAT not configured)"
            exit 0
          fi
          if ! GH_TOKEN="$SHIP_REVIEW_TOKEN" gh pr review "$PR_NUMBER" --approve \
               --body "Auto-approved by daily-report workflow: CI passed on \`$BRANCH\`, diff is \`DAILY_REPORTS/*.md\` only (LUL-534)."; then
            echo "::error::could not submit the required approving review on #$PR_NUMBER; refusing to auto-merge."
            exit 1
          fi
          echo "::notice::review submitted"

          # ── merge ────────────────────────────────────────────────────────────
          if gh pr merge "$PR_NUMBER" --squash --delete-branch; then
            echo "::notice::PR #$PR_NUMBER merged"
          else
            echo "::error::merge of PR #$PR_NUMBER refused -- it stays open with green CI. Check the branch protection rules."
            exit 1
          fi

      - name: no-op summary
        if: steps.diff.outputs.empty == 'true'
        run: echo "::notice::DAILY_REPORTS/ is already up to date -- nothing committed"
