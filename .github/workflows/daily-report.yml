name: Daily report

# Generates DAILY_REPORTS/ entries for the last 2 days and lands the diff.
# Spec: wiki systems/daily-reports §9.
#
# Why the full cycle lives in this one job (LUL-534, credential fixed LUL-1115):
# A push made with GITHUB_TOKEN does not trigger other workflows (GitHub's
# recursion guard) -- push events are suppressed for GITHUB_TOKEN-authored
# commits, unconditionally (systems/ci-github-token-blind-spot). This
# workflow therefore handles everything:
#   1. generate → commit → push branch, authenticated with SHIP_REVIEW_PAT
#      so the push fires `CI / push` naturally
#   2. open PR
#   3. wait for that push-triggered CI run, then submit an approving review
#      and merge
#
# LUL-1115 (reconciles LUL-1049 and LUL-1058): step 1 used to push under
# `github.token`, whose push events `ci.yml` never sees, so this job used to
# dispatch CI by hand as a compensating fallback (`workflow_dispatch`). That
# fallback could never satisfy the merge gate: a `workflow_dispatch` run's
# check-runs never enter the PR's `statusCheckRollup`, which is what
# `PUT /pulls/{n}/merge` actually reads (LUL-762) -- every nightly report PR
# was permanently unmergeable no matter how green CI was. The dead dispatch
# step is removed; the push now authenticates as `SHIP_REVIEW_PAT` (the
# studio PAT, `DadonStyle`) for that one `git push` invocation only, via a
# credential helper that reads the token from an env var -- never via
# `persist-credentials` on checkout (that would keep the PAT live in
# `.git/config` for every later step in the job, including `npm ci`'s
# arbitrary third-party postinstall scripts) and never embedded in a remote
# URL (`decisions/0011-pat-leaked-via-remote-url` already burned a PAT that
# way). See the "commit and push" step below for the mechanism.
#
# Declared side effect: a real-credential, [ship]-marked push on a `lul-*`
# branch also matches auto-pr.yml's `push` trigger and, once CI completes,
# automerge.yml's -- both now process this same PR independently of this
# job, the same as every other `[ship]` branch in the repo. All paths
# converge on the same outcome (squash + delete-branch) using the same
# SHIP_REVIEW_PAT identity for the approving review, so a duplicate review is
# harmless; the "wait for CI, approve, and merge" step below checks whether
# the PR is already merged before acting, so a rival path winning the race
# reads as success, not a red run.
#
# The approving review below must be submitted under a different identity than
# the PR author, or GitHub 422s with "Review Can not approve your own pull
# request" (systems/github-access "Self-approval") -- this PR is opened under
# `github.token` (`github-actions[bot]`), same as every other self-serve PR in
# this repo, so the review step cannot reuse `github.token` either. It uses
# the `SHIP_REVIEW_PAT` repo secret instead, exactly like automerge.yml
# (LUL-558) -- see systems/ship-never-merges-review-count-gap. `bot-approve.yml`
# cannot substitute here (unlike automerge.yml's LUL-912 fix): that workflow
# also runs as `github-actions[bot]`, so it would be approving its own PR and
# 422 the same way `github.token` does. There is no identity in this repo
# other than `SHIP_REVIEW_PAT` that can approve a bot-authored PR (LUL-960).
#
# Failure modes:
#   - No diff → exits 0, nothing committed (expected when nothing landed).
#   - SHIP_REVIEW_PAT not configured at push time → exits 1 before anything is
#     pushed (LUL-1115): pushing under github.token instead would silently
#     reproduce the exact bug this fixes, so this fails loud instead. (The
#     LUL-960 comment-and-continue fallback further down, for a missing
#     SHIP_REVIEW_PAT at *review* time, is therefore normally unreachable in
#     a single run -- kept as defense in depth, e.g. a secret revoked
#     mid-run, not as the expected path.)
#   - CI red/timeout, review-submit failure, or merge refused → exits 1; PR
#     stays open with the problem visible in the run log, pending next night.
#   - A rival workflow (auto-pr.yml/automerge.yml, see "declared side effect"
#     above) already merged the PR by the time this job checks → exits 0,
#     not an error.
#   The following night's run uses --since 2 days ago, so a missed day is
#   always corrected on the next successful run.

on:
  schedule:
    # 21:10 UTC = 00:10 Asia/Jerusalem -- ten minutes after the reported day ends
    - cron: '10 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  # LUL-1115: the dead "dispatch CI" step (which POSTed to the workflow
  # dispatch API) is gone; the two remaining Actions API calls in "wait for
  # CI, approve, and merge" are both GETs, which `read` covers.
  actions: read

concurrency:
  # One run at a time. A schedule tick that fires while the previous night's
  # run is still waiting on CI cancels it rather than stacking open PRs.
  group: daily-report
  cancel-in-progress: true

jobs:
  generate-and-land:
    name: generate reports and land PR
    runs-on: ubuntu-latest
    if: github.repository == 'DadonStyle/LULLWOOD'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # LUL-1115: never persist a credential here. The default
          # (persist-credentials: true) would write whatever token this uses
          # into `.git/config` as an `http.extraheader` for the rest of the
          # job -- including `npm ci` and the report generator, both of which
          # run arbitrary/generated code with filesystem read access to
          # `.git/config`. This checkout only needs to read; the one step
          # that pushes ("commit and push", below) authenticates that single
          # `git push` invocation on its own via a scoped credential helper,
          # never via a persisted config value.
          persist-credentials: false
          # LUL-925: branch from (and target) `release/next`, not `main`. The
          # release train only lets `release/next` reach `main`, and
          # `.github/scripts/base-branch-guard.sh` enforces it: a PR whose base
          # is `main` and whose head is not `release/next` FAILS the required
          # "base branch guard" check unless it carries `emergency-hotfix`.
          # This workflow opened its PR with `--base main`, so every nightly
          # report PR was structurally unmergeable -- it opened, went red on
          # the guard, and sat there (PR #206, run 33156610173). Reports reach
          # `main` the way everything else does: the version cut.
          ref: release/next

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install dependencies
        run: npm ci

      # Compute the 2-day window in Asia/Jerusalem. Python gives reliable TZ
      # arithmetic without shell tricks that differ across runner images.
      - name: compute date range
        id: dates
        run: |
          python3 - <<'EOF'
          import os
          from datetime import datetime, timedelta
          import zoneinfo

          tz = zoneinfo.ZoneInfo("Asia/Jerusalem")
          now = datetime.now(tz)
          yesterday   = (now - timedelta(days=1)).strftime('%Y-%m-%d')
          day_before  = (now - timedelta(days=2)).strftime('%Y-%m-%d')
          branch      = f'lul-534-daily-{yesterday}'

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'since={day_before}\n')
              f.write(f'until={yesterday}\n')
              f.write(f'branch={branch}\n')
          EOF

      - name: generate reports
        run: |
          node scripts/daily-report.mjs \
            --since=${{ steps.dates.outputs.since }} \
            --until=${{ steps.dates.outputs.until }}

      - name: check for changes
        id: diff
        run: |
          # `git diff` only sees changes to already-tracked files. The
          # generator's whole job is writing DAILY_REPORTS/<new-day>.md,
          # which is untracked on first write, so `git diff --quiet HEAD --`
          # reports "nothing changed" even when two brand-new report files
          # just landed on disk (found live 2026-08-26, LUL-534). `git
          # status --porcelain` covers untracked and modified paths alike.
          if [ -z "$(git status --porcelain -- DAILY_REPORTS/)" ]; then
            echo "empty=true"  >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: commit and push
        if: steps.diff.outputs.empty == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SHIP_REVIEW_TOKEN: ${{ secrets.SHIP_REVIEW_PAT }}
          BRANCH: ${{ steps.dates.outputs.branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # LUL-1115: a branch from an earlier run tonight (same schedule
          # window, a prior attempt that got this far but failed downstream)
          # may already have an open PR. Reuse it rather than deleting and
          # recreating the ref -- deleting a ref with an open PR attached
          # closes that PR as a side effect, which is what silently ate
          # several nights of failed-but-real evidence (LUL-1058). Report
          # content is idempotent (systems/daily-reports §7), so a same-night
          # rerun has nothing new to add on top of an already-open PR.
          existing_pr="$(gh pr list --head "$BRANCH" --state open \
                            --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            echo "::notice::PR #$existing_pr already open for $BRANCH from earlier tonight; reusing it, nothing new to push."
            exit 0
          fi

          # LUL-1115: must push under a real credential, not github.token --
          # github.token pushes are invisible to ci.yml's `push` trigger, so
          # CI's checks never enter the PR's statusCheckRollup no matter how
          # green they are (systems/ci-github-token-blind-spot, LUL-762).
          if [ -z "${SHIP_REVIEW_TOKEN:-}" ]; then
            echo "::error::SHIP_REVIEW_PAT secret is not configured; refusing to push under github.token, whose pushes ci.yml's push trigger never sees."
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add DAILY_REPORTS/
          git commit -m "LUL-534: daily reports ${{ steps.dates.outputs.until }}

          Auto-generated by the nightly daily-report workflow.
          Changed files: DAILY_REPORTS/*.md only — qualifies for [ship].

          [ship]"

          # A branch can still be left over with no open PR attached
          # (already merged, or a human closed it) -- clear it so the push
          # below is a clean fast-forward. Only reached once we already know
          # there is no open PR to protect.
          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" 2>/dev/null || true

          # Authenticate this one push as SHIP_REVIEW_PAT without ever
          # putting the token in `.git/config` or in a remote URL (the exact
          # mechanism decisions/0011-pat-leaked-via-remote-url burned a PAT
          # on -- a later `git remote -v` would print it). A credential
          # helper scoped to this single invocation reads the token from the
          # environment when git invokes it; the token itself never appears
          # in this command's argv, only the env-var *name* does.
          git -c credential.helper='!f() { echo "username=x-access-token"; echo "password=$SHIP_REVIEW_TOKEN"; }; f' \
              push origin "HEAD:refs/heads/$BRANCH"

      - name: open PR
        if: steps.diff.outputs.empty == 'false'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.dates.outputs.branch }}
          UNTIL: ${{ steps.dates.outputs.until }}
        run: |
          set -euo pipefail

          # Idempotent: if a PR already opened (e.g. this step reruns), reuse it.
          existing="$(gh pr list --head "$BRANCH" --state open \
                        --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "number=$existing" >> "$GITHUB_OUTPUT"
            echo "::notice::PR #$existing already exists for $BRANCH"
            exit 0
          fi

          # `gh pr create` does NOT accept --json/--jq -- unlike `gh pr list`
          # just above, which does. It prints the new PR's URL on stdout, so
          # the number is the last path segment. Passing --json here made this
          # step die with "unknown flag: --json" on the very first run that
          # ever reached it (LUL-534, run 33032851122): until the untracked-file
          # fix landed, step 7 always reported "empty" and steps 8-11 skipped,
          # so this line had never once executed.
          url="$(gh pr create \
            --base release/next \
            --head "$BRANCH" \
            --title "LUL-534: daily reports $UNTIL" \
            --body "Auto-generated by the nightly daily-report workflow (LUL-534).

          Changes: \`DAILY_REPORTS/*.md\` only — qualifies for \`[ship]\`.
          See \`.github/scripts/ship-allowed.sh\`.

          **Mobile:** docs-only, no gameplay or UI changes.")"

          number="${url##*/}"

          # Fail closed: an empty or non-numeric parse would otherwise be handed
          # to the merge step, which would approve and merge the wrong PR.
          case "$number" in
            ''|*[!0-9]*)
              echo "::error::could not parse a PR number from gh pr create output: '$url'"
              exit 1
              ;;
          esac

          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "::notice::opened PR #$number for $BRANCH"

      - name: wait for CI, approve, and merge
        if: steps.diff.outputs.empty == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SHIP_REVIEW_TOKEN: ${{ secrets.SHIP_REVIEW_PAT }}
          BRANCH: ${{ steps.dates.outputs.branch }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # ── locate the CI run ────────────────────────────────────────────────
          # LUL-1115: "commit and push" now authenticates its push as
          # SHIP_REVIEW_PAT, a real credential, so it fires `CI / push`
          # naturally -- `event=push` is the only run type whose check-runs
          # enter the PR's statusCheckRollup, which is what `gh pr merge`
          # below actually evaluates (LUL-762). No separate dispatch is
          # needed. Only this workflow ever pushes to this branch, so the
          # latest push-triggered run is always the right one to track --
          # whether it started from this run's own push above, or (when an
          # already-open PR was reused) from an earlier run's push tonight.
          # Allow up to 3 minutes for GitHub to register the run.
          echo "::notice::waiting for CI's push-triggered run on $BRANCH..."
          run_id=""
          for i in $(seq 1 18); do
            sleep 10
            run_id="$(gh api \
              "repos/$REPO/actions/workflows/ci.yml/runs?branch=$BRANCH&event=push&per_page=1" \
              --jq '.workflow_runs[0].id // empty')"
            [ -n "$run_id" ] && break
          done

          if [ -z "$run_id" ]; then
            echo "::error::timed out waiting for CI run to appear on $BRANCH; PR #$PR_NUMBER stays open"
            exit 1
          fi
          echo "::notice::tracking CI run $run_id"

          # ── wait for completion (up to 50 min, poll every 30 s) ─────────────
          # LUL-534: this budget was 25 min (50 × 30 s) and was structurally too
          # short -- it could never succeed, on any run. CI's "playwright smoke
          # suite" job alone takes ~26 min (measured over three consecutive
          # green runs: 33156322203 = 25.8, 33156660086 = 26.2, 33157020332 =
          # 25.8), and the whole CI run wall-clock is ~27 min. Run 33156610173
          # gave up at 09:11:45 on a CI run that went green at 09:13:33 -- 108
          # seconds early -- and reported "did not complete within the time
          # limit", which reads exactly like a hung or broken CI rather than a
          # wait that was simply too impatient. Budget 50 min so a slower-than-
          # usual suite still lands; the job has no timeout-minutes, so the
          # 360 min GitHub default is the real ceiling and this stays well under
          # it. Raise this if the playwright suite's runtime grows again.
          status=""; conclusion=""
          for i in $(seq 1 100); do
            sleep 30
            result="$(gh api "repos/$REPO/actions/runs/$run_id" \
                        --jq '[.status, (.conclusion // "")] | join(":")')"
            status="${result%%:*}"
            conclusion="${result##*:}"
            echo "::notice::run $run_id: $status/$conclusion"
            [ "$status" = "completed" ] && break
          done

          if [ "$status" != "completed" ]; then
            echo "::error::CI run $run_id did not complete within the time limit"
            exit 1
          fi

          if [ "$conclusion" != "success" ]; then
            echo "::error::CI run $run_id concluded $conclusion -- PR #$PR_NUMBER stays open"
            exit 1
          fi

          # ── race check ────────────────────────────────────────────────────────
          # LUL-1115: the real-credential push above also satisfies
          # auto-pr.yml's and automerge.yml's own triggers (see the file
          # header) -- either can review and merge this exact PR
          # independently before this step gets here. An already-merged PR
          # is success, not a failure to report: skip straight past both the
          # review submission and the merge call below, so a rival path
          # winning the declared race doesn't paint this scheduled job red
          # (LUL-925) for a run that actually succeeded.
          already_merged="$(gh pr view "$PR_NUMBER" --json merged --jq '.merged')"
          if [ "$already_merged" = "true" ]; then
            echo "::notice::PR #$PR_NUMBER was already merged (auto-pr.yml/automerge.yml won the race); nothing left to do."
            exit 0
          fi

          # ── submit approving review ──────────────────────────────────────────
          # Required because the main ruleset enforces required_approving_review_count=1
          # with no bypass actor. This PR is authored by github-actions[bot] under
          # github.token, so github.token approving it 422s unconditionally
          # ("Review Can not approve your own pull request") -- there is no repo
          # setting that lifts GitHub's same-identity rule, and bot-approve.yml
          # can't stand in either -- it is the same identity as the PR author
          # here (see the header comment). Must run under SHIP_REVIEW_TOKEN (the
          # studio PAT), never GH_TOKEN.
          #
          # LUL-960: an unconfigured secret is a known, standing condition (it
          # has never been configured on this repo), not a per-run anomaly --
          # `exit 1` here used to red the schedule every night for the same
          # unactionable reason, and that red is easy to stop reading (LUL-912
          # documented the same silent-refusal shape on automerge.yml). Leave
          # the PR open and go green, but say exactly why on the PR itself so
          # it's found by anyone browsing open PRs, not only by whoever reads
          # that night's Actions log.
          if [ -z "${SHIP_REVIEW_TOKEN:-}" ]; then
            echo "::warning::SHIP_REVIEW_PAT secret is not configured; PR #$PR_NUMBER needs a manual approving review and merge."
            body="Auto-merge did not run: the \`SHIP_REVIEW_PAT\` repo secret is not configured, so there is no identity available to submit the required approving review on this bot-authored PR (\`github.token\` and \`bot-approve.yml\` both 422 on self-approval here — see LUL-960)."
            body="$body"$'\n\n'"CI is green on \`$BRANCH\`. Diff is \`DAILY_REPORTS/*.md\` only."
            body="$body"$'\n\n'"**This PR needs a human or the Code Reviewer to approve and merge it manually.** Tomorrow night's run covers a rolling 2-day window, so a missed merge isn't lost — but letting these stack up wastes the CI run each one already paid for."
            gh pr comment "$PR_NUMBER" --body "$body"
            echo "::notice::daily-report run complete: PR #$PR_NUMBER opened, CI green, left open pending manual review (SHIP_REVIEW_PAT not configured)"
            exit 0
          fi
          if ! GH_TOKEN="$SHIP_REVIEW_TOKEN" gh pr review "$PR_NUMBER" --approve \
               --body "Auto-approved by daily-report workflow: CI passed on \`$BRANCH\`, diff is \`DAILY_REPORTS/*.md\` only (LUL-534)."; then
            echo "::error::could not submit the required approving review on #$PR_NUMBER; refusing to auto-merge."
            exit 1
          fi
          echo "::notice::review submitted"

          # ── merge ────────────────────────────────────────────────────────────
          # LUL-762 (2026-09-05): merge under SHIP_REVIEW_TOKEN too, not just
          # the push above -- a github.token merge produces a release/next
          # commit exempt from ci.yml's push trigger just like an unfixed
          # push would, so the LUL-1115 push fix alone doesn't fully close
          # this. SHIP_REVIEW_TOKEN is already known non-empty here (checked
          # above before the review step).
          if GH_TOKEN="$SHIP_REVIEW_TOKEN" gh pr merge "$PR_NUMBER" --squash --delete-branch; then
            echo "::notice::PR #$PR_NUMBER merged"
          else
            echo "::error::merge of PR #$PR_NUMBER refused -- it stays open with green CI. Check the branch protection rules."
            exit 1
          fi

      - name: no-op summary
        if: steps.diff.outputs.empty == 'true'
        run: echo "::notice::DAILY_REPORTS/ is already up to date -- nothing committed"
