name: Daily report

# Generates DAILY_REPORTS/ entries for the last 2 days and lands the diff.
# Spec: wiki systems/daily-reports §9.
#
# Why the full cycle lives in this one job (LUL-534):
# A push made with GITHUB_TOKEN does not trigger other workflows (GitHub's
# recursion guard). auto-pr.yml fires on push only, and automerge.yml fires
# only when CI's triggering event is "push" -- both are silent on
# GITHUB_TOKEN-authored pushes. This workflow therefore handles everything:
#   1. generate → commit → push branch
#   2. open PR
#   3. dispatch CI explicitly (workflow_dispatch is exempt from suppression)
#   4. wait for CI, then submit an approving review and merge
#
# Failure modes:
#   - No diff → exits 0, nothing committed (expected when nothing landed).
#   - CI red → exits 1, PR stays open with green-CI pending next night.
#   - Merge refused (e.g. review rejection) → same; PR stays open.
#   The following night's run uses --since 2 days ago, so a missed day is
#   always corrected on the next successful run.

on:
  schedule:
    # 21:10 UTC = 00:10 Asia/Jerusalem -- ten minutes after the reported day ends
    - cron: '10 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  # One run at a time. A schedule tick that fires while the previous night's
  # run is still waiting on CI cancels it rather than stacking open PRs.
  group: daily-report
  cancel-in-progress: true

jobs:
  generate-and-land:
    name: generate reports and land PR
    runs-on: ubuntu-latest
    if: github.repository == 'DadonStyle/LULLWOOD'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install dependencies
        run: npm ci

      # Compute the 2-day window in Asia/Jerusalem. Python gives reliable TZ
      # arithmetic without shell tricks that differ across runner images.
      - name: compute date range
        id: dates
        run: |
          python3 - <<'EOF'
          import os
          from datetime import datetime, timedelta
          import zoneinfo

          tz = zoneinfo.ZoneInfo("Asia/Jerusalem")
          now = datetime.now(tz)
          yesterday   = (now - timedelta(days=1)).strftime('%Y-%m-%d')
          day_before  = (now - timedelta(days=2)).strftime('%Y-%m-%d')
          branch      = f'lul-534-daily-{yesterday}'

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'since={day_before}\n')
              f.write(f'until={yesterday}\n')
              f.write(f'branch={branch}\n')
          EOF

      - name: generate reports
        run: |
          node scripts/daily-report.mjs \
            --since=${{ steps.dates.outputs.since }} \
            --until=${{ steps.dates.outputs.until }}

      - name: check for changes
        id: diff
        run: |
          if git diff --quiet HEAD -- DAILY_REPORTS/; then
            echo "empty=true"  >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: commit and push
        if: steps.diff.outputs.empty == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.dates.outputs.branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add DAILY_REPORTS/
          git commit -m "LUL-534: daily reports ${{ steps.dates.outputs.until }}

          Auto-generated by the nightly daily-report workflow.
          Changed files: DAILY_REPORTS/*.md only — qualifies for [ship].

          [ship]"

          # If a branch from a previous failed run exists, drop it so our push
          # is a clean fast-forward from current main. Closing any leftover PR
          # is intentional: we are about to open a fresh one with the new diff.
          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" 2>/dev/null || true

          git push origin "HEAD:refs/heads/$BRANCH"

      - name: open PR
        if: steps.diff.outputs.empty == 'false'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.dates.outputs.branch }}
          UNTIL: ${{ steps.dates.outputs.until }}
        run: |
          set -euo pipefail

          # Idempotent: if a PR already opened (e.g. this step reruns), reuse it.
          existing="$(gh pr list --head "$BRANCH" --state open \
                        --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "number=$existing" >> "$GITHUB_OUTPUT"
            echo "::notice::PR #$existing already exists for $BRANCH"
            exit 0
          fi

          number="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "LUL-534: daily reports $UNTIL" \
            --body "Auto-generated by the nightly daily-report workflow (LUL-534).

          Changes: \`DAILY_REPORTS/*.md\` only — qualifies for \`[ship]\`.
          See \`.github/scripts/ship-allowed.sh\`.

          **Mobile:** docs-only, no gameplay or UI changes." \
            --json number --jq '.number')"

          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "::notice::opened PR #$number for $BRANCH"

      - name: dispatch CI
        if: steps.diff.outputs.empty == 'false'
        id: ci-dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.dates.outputs.branch }}
        run: |
          set -euo pipefail

          # Snapshot time just before dispatch so the poll step can identify
          # the right run by creation timestamp.
          echo "dispatch_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

          gh api -X POST \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/dispatches" \
            -f "ref=$BRANCH"

          echo "::notice::CI dispatched on $BRANCH"

      - name: wait for CI, approve, and merge
        if: steps.diff.outputs.empty == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.dates.outputs.branch }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          DISPATCH_TIME: ${{ steps.ci-dispatch.outputs.dispatch_time }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # ── locate the CI run ────────────────────────────────────────────────
          # Allow up to 3 minutes for GitHub to register the dispatched run.
          echo "::notice::waiting for CI run on $BRANCH (dispatched ≥ $DISPATCH_TIME)..."
          run_id=""
          for i in $(seq 1 18); do
            sleep 10
            run_id="$(gh api \
              "repos/$REPO/actions/workflows/ci.yml/runs?branch=$BRANCH&event=workflow_dispatch&per_page=20" \
              --jq ".workflow_runs[] | select(.created_at >= \"$DISPATCH_TIME\") | .id" \
              | head -1)"
            [ -n "$run_id" ] && break
          done

          if [ -z "$run_id" ]; then
            echo "::error::timed out waiting for CI run to appear on $BRANCH; PR #$PR_NUMBER stays open"
            exit 1
          fi
          echo "::notice::tracking CI run $run_id"

          # ── wait for completion (up to 25 min, poll every 30 s) ─────────────
          status=""; conclusion=""
          for i in $(seq 1 50); do
            sleep 30
            result="$(gh api "repos/$REPO/actions/runs/$run_id" \
                        --jq '[.status, (.conclusion // "")] | join(":")')"
            status="${result%%:*}"
            conclusion="${result##*:}"
            echo "::notice::run $run_id: $status/$conclusion"
            [ "$status" = "completed" ] && break
          done

          if [ "$status" != "completed" ]; then
            echo "::error::CI run $run_id did not complete within the time limit"
            exit 1
          fi

          if [ "$conclusion" != "success" ]; then
            echo "::error::CI run $run_id concluded $conclusion -- PR #$PR_NUMBER stays open"
            exit 1
          fi

          # ── submit approving review ──────────────────────────────────────────
          # Required because the main ruleset enforces required_approving_review_count=1.
          # github-actions[bot] can approve when "Allow GitHub Actions to create
          # and approve pull requests" is enabled (Settings → Actions → General).
          # If self-approval is rejected, we log a warning and attempt the merge
          # anyway (an existing founder review would still satisfy the requirement).
          gh api -X POST \
            "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            -f "event=APPROVE" \
            -f "body=Auto-approved by daily-report workflow: CI passed on \`$BRANCH\`, diff is \`DAILY_REPORTS/*.md\` only (LUL-534)." \
            && echo "::notice::review submitted" \
            || echo "::warning::review submission failed (will try merge anyway)"

          # ── merge ────────────────────────────────────────────────────────────
          if gh pr merge "$PR_NUMBER" --squash --delete-branch; then
            echo "::notice::PR #$PR_NUMBER merged"
          else
            echo "::error::merge of PR #$PR_NUMBER refused -- it stays open with green CI. Check the branch protection rules."
            exit 1
          fi

      - name: no-op summary
        if: steps.diff.outputs.empty == 'true'
        run: echo "::notice::DAILY_REPORTS/ is already up to date -- nothing committed"
